;
; SIP over TCP and TLS, for scripts/lab.sh's `tls` step alone
; (interop/tls/compose.override.yaml mounts this over the empty default).
; Three TLS listeners, one certificate each, all signed by the lab's own
; authority: 5061 presents one for asterisk.lab.sipral.test, the name the
; agents are told to expect; 5062 one for wrong.lab.sipral.test; 5063 one
; for the right name that expired in 2020. Asterisk only presents them: a
; client that is told the lab authority is the only one it trusts connects
; to 5061 and refuses the other two, each for its own reason.

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/lab-tls/asterisk.pem
priv_key_file=/etc/asterisk/lab-tls/asterisk.key
method=tlsv1_2

[transport-tls-wrong-name]
type=transport
protocol=tls
bind=0.0.0.0:5062
cert_file=/etc/asterisk/lab-tls/wrong.pem
priv_key_file=/etc/asterisk/lab-tls/wrong.key
method=tlsv1_2

[transport-tls-expired]
type=transport
protocol=tls
bind=0.0.0.0:5063
cert_file=/etc/asterisk/lab-tls/expired.pem
priv_key_file=/etc/asterisk/lab-tls/expired.key
method=tlsv1_2

; One account per layer, so that the call each is given cannot land on
; another's registration: the Python, Kotlin and .NET agents over TLS, the
; Swift one over TCP, since Swift has TLS only where Network.framework is
; and the lab runs it on Linux.
[labuser-agent-tls]
type=auth
auth_type=userpass
username=labuser-agent-tls
password=labpass

[labuser-agent-tls]
type=aor
max_contacts=10

[labuser-agent-tls]
type=endpoint
transport=transport-tls
context=lab
auth=labuser-agent-tls
aors=labuser-agent-tls
disallow=all
allow=ulaw
allow=alaw

