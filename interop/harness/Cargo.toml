[package]
name = "sipral-interop"
description = "Drives sipral-ua against the container lab and judges each flow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
# The facade: signalling and media joined, the same seam an application
# links. RTP, codecs, DTMF and SRTP all come from here now; nothing in this
# crate opens a `sipral_rtp::RtpSession` or a `sipral_media` codec directly.
#
# default-features = false: the lab is driven on G.711 and G.722, nothing here
# encodes Opus, and this way the harness builds on a machine with no C++
# toolchain. A workspace build still links libopus, because some other crate
# in the graph asks for it and features unify.
#
# `dtls` back on, alone: the DTLS-SRTP flow runs a handshake on the media
# path, and it is pure Rust.
sipral = { path = "../../crates/sipral", version = "0.0.1", default-features = false, features = [
    "dtls",
] }
# Kept for reading what arrived, which the facade does not re-export the
# parsers for: `HeaderName` and `OwnedMessage` for a refusal's own Warning and
# reason phrase, and `sdp::parse` for the format list an offer really carried.
# Nothing here writes a description any more — the hold-with-a-codec-change
# flow's re-offer is `sipral::MediaEngine::change_codecs`'s — and everything
# else this crate used to reach into `sipral-core`, `sipral-media` and
# `sipral-rtp` for goes through `sipral` instead.
sipral-core.workspace = true
# The wasapi flow's own resampler (src/wasapi.rs): a real WASAPI endpoint runs
# shared mode at whatever rate the audio engine mixes at, commonly 48 kHz,
# never the call's own 8 kHz or 16 kHz, and `sipral-io-wasapi` deliberately
# does not paper over that (its own doc says so). `sipral-media::resample` is
# where that conversion already lives for the rest of this stack, and reaching
# for it here is cheaper and safer than a second one written only for this
# flow. default-features = false for the same reason as `sipral` above: this
# crate never encodes Opus, and pulling it in would ask Windows for a C++
# toolchain over nothing this flow uses.
sipral-media = { path = "../../crates/sipral-media", version = "0.0.1", default-features = false }

# Two flows whose audio is a real device's, one per desktop this stack
# targets: a call whose microphone and earpiece are PipeWire nodes
# (src/pipewire.rs) or WASAPI endpoints (src/wasapi.rs). Both off unless
# asked for, and each only on its own platform, because each links a
# platform audio library the image or machine every other flow runs on has
# no reason to carry. interop/pipewire/run.sh and interop/wasapi/run.ps1
# build with the matching feature, on a machine that has it.
[features]
pipewire = ["dep:sipral-io-pipewire"]
wasapi = ["dep:sipral-io-wasapi"]

[target.'cfg(target_os = "linux")'.dependencies]
sipral-io-pipewire = { path = "../../crates/sipral-io-pipewire", version = "0.0.1", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
sipral-io-wasapi = { path = "../../crates/sipral-io-wasapi", version = "0.0.1", optional = true }

[lints]
workspace = true
