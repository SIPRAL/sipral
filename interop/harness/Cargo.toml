[package]
name = "sipral-interop"
description = "Drives sipral-ua against the container lab and judges each flow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
# The facade: signalling and media joined, the same seam an application
# links. RTP, codecs, DTMF and SRTP all come from here now; nothing in this
# crate opens a `sipral_rtp::RtpSession` or a `sipral_media` codec directly.
#
# default-features = false: the lab is driven on G.711 and G.722, nothing here
# encodes Opus, and this way the harness builds on a machine with no C++
# toolchain. A workspace build still links libopus, because some other crate
# in the graph asks for it and features unify.
sipral = { path = "../../crates/sipral", version = "0.0.1", default-features = false }
# Kept for reading what arrived, which the facade does not re-export the
# parsers for: `HeaderName` and `OwnedMessage` for a refusal's own Warning and
# reason phrase, and `sdp::parse` for the format list an offer really carried.
# Nothing here writes a description any more — the hold-with-a-codec-change
# flow's re-offer is `sipral::MediaEngine::change_codecs`'s — and everything
# else this crate used to reach into `sipral-core`, `sipral-media` and
# `sipral-rtp` for goes through `sipral` instead.
sipral-core.workspace = true

[lints]
workspace = true
