;
; The lab's numbers on a FreePBX, as interop/asterisk/extensions.conf has
; them, in a context only the lab's own accounts (pjsip_sipral_lab.conf)
; reach: nothing FreePBX routes ever lands here, and FreePBX never writes
; this file. The host name in MessageSend is the one difference.

[sipral-lab]
exten => 9000,1,Dial(Local/9002@sipral-lab)
 same => n,Hangup()

exten => 9002,1,Answer()
 same => n,Playtones(350+440/1200,0/600)
 same => n,Wait(60)
 same => n,Hangup()

exten => 9001,1,Answer()
 same => n,Playtones(busy)
 same => n,Wait(60)
 same => n,Hangup()

exten => 9003,1,Answer()
 same => n,Read(digit,,1,,1,5)
 same => n,SendDTMF(${digit})
 same => n,Hangup()

exten => 9004,1,Dial(Local/9002@sipral-lab)
 same => n,Hangup()

exten => 9005,1,Dial(Local/9002@sipral-lab)
 same => n,Hangup()

exten => 9006,1,NoOp(MESSAGE from ${MESSAGE(from)}: ${MESSAGE(body)})
 same => n,Set(SENDER=${CUT(CUT(MESSAGE(from),@,1),:,2)})
 same => n,Set(MESSAGE(body)=echo: ${MESSAGE(body)})
 same => n,MessageSend(pjsip:${SENDER},sip:9006@freepbx)
 same => n,Hangup()

; a message left in the mailbox the lab's MWI account subscribes to,
; recorded by VoiceMail() itself: no instructions ("s"), and the mailbox's
; own unavailable greeting is a second of silence (install.sh), so the
; recording starts before the harness hangs up. app_voicemail announces the
; new count on its own, and res_pjsip_mwi NOTIFYs it.
exten => 9007,1,Answer()
 same => n,VoiceMail(9007@default,su)
 same => n,Hangup()

exten => 9008,1,Answer()
 same => n,Echo()
 same => n,Hangup()
