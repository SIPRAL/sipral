;
; The lab's own accounts on a FreePBX, beside its extensions and apart from
; them: PJSIP endpoints in a context of their own (sipral-lab,
; extensions_sipral_lab.conf), each the same as interop/asterisk/pjsip.conf's
; endpoint of the same name, so the harness's flows run against the Asterisk
; under FreePBX as they run against the lab's. FreePBX never writes this
; file; install.sh includes it from pjsip_custom_post.conf, which FreePBX
; leaves alone too, and writes the password in from the box's own env file.
; It is never committed. TRANSPORT is FreePBX's own UDP transport.

; a blind REFER names the host the harness registered to, as on the lab's
; Asterisk (interop/asterisk/pjsip.conf says why)
[freepbx]
type=domain_alias
domain=freepbx

[sipral-lab-auth](!)
type=auth
auth_type=userpass
password=@SECRET@

[sipral-lab-aor](!)
type=aor
max_contacts=10

[sipral-lab-endpoint](!)
type=endpoint
transport=@TRANSPORT@
context=sipral-lab
; FreePBX sets TRANSFER_CONTEXT globally to its own from-internal-xfer,
; where a blind REFER to the lab's numbers finds nothing (404)
set_var=TRANSFER_CONTEXT=sipral-lab
disallow=all
allow=ulaw
allow=alaw

[labuser](sipral-lab-auth)
username=labuser
[labuser](sipral-lab-aor)
[labuser](sipral-lab-endpoint)
auth=labuser
aors=labuser

; SDES required (RFC 4568)
[labuser-srtp](sipral-lab-auth)
username=labuser-srtp
[labuser-srtp](sipral-lab-aor)
[labuser-srtp](sipral-lab-endpoint)
auth=labuser-srtp
aors=labuser-srtp
media_encryption=sdes

; DTLS-SRTP (RFC 5764), with a certificate Asterisk makes for itself
[labuser-dtls](sipral-lab-auth)
username=labuser-dtls
[labuser-dtls](sipral-lab-aor)
[labuser-dtls](sipral-lab-endpoint)
auth=labuser-dtls
aors=labuser-dtls
media_encryption=dtls
dtls_auto_generate_cert=yes
dtls_verify=fingerprint
dtls_setup=actpass
; RTP and RTCP on one port (RFC 5761), which DTLS-SRTP keys as one
rtcp_mux=yes

; digits by SIP INFO both ways
[labuser-infodtmf](sipral-lab-auth)
username=labuser-infodtmf
[labuser-infodtmf](sipral-lab-aor)
[labuser-infodtmf](sipral-lab-endpoint)
auth=labuser-infodtmf
aors=labuser-infodtmf
dtmf_mode=info

; the mailbox's subscriber: on the AOR, which a SUBSCRIBE to
; message-summary is matched against
[labuser-mwi](sipral-lab-auth)
username=labuser-mwi
[labuser-mwi](sipral-lab-aor)
mailboxes=9007@default
[labuser-mwi](sipral-lab-endpoint)
auth=labuser-mwi
aors=labuser-mwi

; G.729 and nothing else
[labuser-g729](sipral-lab-auth)
username=labuser-g729
[labuser-g729](sipral-lab-aor)
[labuser-g729](sipral-lab-endpoint)
auth=labuser-g729
aors=labuser-g729
disallow=all
allow=g729
