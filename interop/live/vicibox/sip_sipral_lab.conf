;
; The lab's own accounts on a ViciBox, beside the dialer's phones and apart
; from them: chan_sip peers in a context of their own (sipral-lab,
; extensions_sipral_lab.conf), each the same as interop/asterisk/pjsip.conf's
; endpoint of the same name, so the harness's flows run against the
; Asterisk inside VICIdial as they run against the lab's. install.sh writes
; the password in from the box's own env file; it is never committed.

[sipral-lab](!)
type=friend
host=dynamic
context=sipral-lab
secret=@SECRET@
disallow=all
allow=ulaw,alaw
nat=force_rport,comedia
qualify=no

[labuser](sipral-lab)

; SDES required (RFC 4568)
[labuser-srtp](sipral-lab)
encryption=yes

; digits by SIP INFO both ways
[labuser-infodtmf](sipral-lab)
dtmfmode=info

; DTLS-SRTP (RFC 5764), with a certificate install.sh makes on the box
[labuser-dtls](sipral-lab)
encryption=yes
dtlsenable=yes
dtlsverify=no
dtlscertfile=/etc/asterisk/keys/sipral-lab.pem
dtlssetup=actpass
; RTP and RTCP on one port (RFC 5761), which DTLS-SRTP keys as one
rtcp_mux=yes

; the mailbox's subscriber: chan_sip NOTIFYs message-summary for it
[labuser-mwi](sipral-lab)
mailbox=9007@default

; G.729 and nothing else
[labuser-g729](sipral-lab)
disallow=all
allow=g729
