#
# A second opinion on registration and routing through a proxy, next to
# Kamailio's. Same one static account, no database, everything that is not a
# REGISTER relayed to FreeSWITCH, Record-Route so the in-dialog requests a
# call makes afterwards come back through here -- functionally the same
# config as ../kamailio/kamailio.cfg, written against the OpenSIPS 4.0
# manual rather than ported from it: the two projects share an ancestor from
# fifteen years back and nothing past that.

log_level=1
stderror_enabled=yes
syslog_enabled=no
# one worker: the lab host is small, and one binding at a time is what every
# flow here does anyway
udp_workers=1
socket=udp:0.0.0.0:5060
dns=no
rev_dns=no
# without this the proxy does not recognise the name it wrote into
# Record-Route as one of its own, so loose_route() leaves the Route header in
# place and forwards the request back to itself -- a tight loop that takes
# the ACK and the BYE with it
auto_aliases=no
alias="opensips"

#!define LAB_USER "labuser"
#!define LAB_PASS "labpass"
#!define LAB_REALM "sipral.test"
# the same lab profile Kamailio relays to -- internal on 5060 challenges a
# proxied call with 407; external on 5080 does not, but it runs NAT
# detection and advertises the runner's public address in Contact, so every
# in-dialog request afterwards leaves the network and never comes back
#!define FS_ADDRESS "freeswitch:5090"

# the Debian trixie package's own path for amd64; a host of a different
# architecture needs this changed along with the image's platform
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
# is_method() and has_totag() live here now, and so does sipmsg_validate(),
# the 4.0 name for what sanity_check() did in the fork this config's sibling
# targets -- siputils, textops and sanity are gone, folded in over fifteen
# years of divergence
loadmodule "sipmsgops.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"

# usrloc kept in memory only, nothing written to a database
modparam("usrloc", "working_mode_preset", "single-instance-no-db")
# the module's own default. Each flow in the harness binds a fresh port, so
# it arrives with a Contact the previous one did not use, and a ceiling of
# one makes save() fail and the third flow see a 503. One binding per
# account is not the thing under test here.
modparam("registrar", "max_contacts", 0)
# pv_www_authorize() has no database or AAA backend behind it: it checks
# whatever these two pseudo-variables hold at the time it is called, which
# route[REGISTRAR] sets to the one lab account below. calculate_ha1 so the
# password variable holds it in the clear rather than a pre-computed HA1.
modparam("auth", "username_spec", "$var(auth_user)")
modparam("auth", "password_spec", "$var(auth_pass)")
modparam("auth", "calculate_ha1", 1)

request_route {
    route(REQINIT);

    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
        } else {
            sl_send_reply("404", "Not Found");
        }
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    t_check_trans();

    if (is_method("OPTIONS") && uri == myself) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    if (is_method("INVITE")) {
        # preset, not record_route(): the proxy listens on the wildcard, so
        # it would write itself into Record-Route as 0.0.0.0 and every
        # in-dialog request afterwards would be routed to nowhere. The name
        # is what both the harness and FreeSWITCH resolve on this network.
        record_route_preset("opensips:5060");
        $du = "sip:" + FS_ADDRESS;
        route(RELAY);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    # "m": Max-Forwards already handled above, and sipmsg_validate() -- 4.0's
    # sanity_check() -- does not auto-reply on a failed check the way the
    # other fork's sanity module does, so the reply is sent here
    if (!sipmsg_validate("m")) {
        sl_send_reply("400", "Bad Request");
        exit;
    }
}

route[REGISTRAR] {
    if ($fU != LAB_USER) {
        sl_send_reply("403", "Forbidden");
        exit;
    }
    $var(auth_user) = LAB_USER;
    $var(auth_pass) = LAB_PASS;
    if (!pv_www_authorize(LAB_REALM)) {
        www_challenge(LAB_REALM, "auth");
        exit;
    }
    if (!save("location")) {
        sl_reply_error();
    }
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
