#
# A second opinion on registration and routing through a proxy, next to
# Kamailio's. Same one static account, no database, everything that is not a
# REGISTER relayed to FreeSWITCH, Record-Route so the in-dialog requests a
# call makes afterwards come back through here -- functionally the same
# config as ../kamailio/kamailio.cfg, written against the OpenSIPS 4.0
# manual rather than ported from it: the two projects share an ancestor from
# fifteen years back and nothing past that, and this file's syntax is where
# that shows. OpenSIPS has no #!define, so the lab account, the realm and
# FreeSWITCH's address are written out where they are used, and its main
# route is `route`, not Kamailio's `request_route`.
#
# The account is labuser / labpass in realm sipral.test, the one Kamailio
# knows. FreeSWITCH is freeswitch:5090, the lab profile Kamailio relays to:
# internal on 5060 challenges a proxied call with 407, and external on 5080
# runs NAT detection and advertises the runner's public address in Contact,
# so every in-dialog request afterwards would leave the network and never
# come back.

# informational messages and above: enough to see which module refused to
# load when one does, next to the "Listening on" banner scripts/lab.sh waits
# for
log_level=3
stderror_enabled=yes
syslog_enabled=no
# one worker: the lab host is small, and one binding at a time is what every
# flow here does anyway
udp_workers=1
socket=udp:0.0.0.0:5060
dns=no
rev_dns=no
# without this the proxy does not recognise the name it wrote into
# Record-Route as one of its own, so loose_route() leaves the Route header in
# place and forwards the request back to itself -- a tight loop that takes
# the ACK and the BYE with it
auto_aliases=no
alias="opensips"

# the Debian trixie package's own path for amd64; a host of a different
# architecture needs this changed along with the image's platform
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
# UDP is built into the binary, so there is no file of that name in the
# directory above, and it still has to be asked for: without it the proxy
# has no transport at all and exits at startup
loadmodule "proto_udp.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
# is_method() and has_totag() live here
loadmodule "sipmsgops.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
# auth sends its challenges through signaling, and refuses to load without it
loadmodule "signaling.so"
# not in the opensips package itself but in opensips-auth-modules, which
# interop/opensips/Dockerfile adds to the image
loadmodule "auth.so"

# usrloc kept in memory only, nothing written to a database. registrar's own
# default of no ceiling on contacts is kept: each flow in the harness binds a
# fresh port and arrives with a Contact the previous one did not use, and one
# binding per account is not the thing under test here.
modparam("usrloc", "working_mode_preset", "single-instance-no-db")
# pv_www_authorize() has no database or AAA backend behind it: it checks
# whatever these two pseudo-variables hold at the time it is called, which
# route[REGISTRAR] sets to the one lab account. calculate_ha1 so the password
# variable holds it in the clear rather than a pre-computed HA1.
modparam("auth", "username_spec", "$var(auth_user)")
modparam("auth", "password_spec", "$var(auth_pass)")
modparam("auth", "calculate_ha1", 1)

route {
    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply(483, "Too Many Hops");
        exit;
    }

    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
        } else {
            sl_send_reply(404, "Not Found");
        }
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    t_check_trans();

    if (is_method("OPTIONS") && $rd == "opensips") {
        sl_send_reply(200, "OK");
        exit;
    }

    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    if (is_method("INVITE")) {
        # preset, not record_route(): the proxy listens on the wildcard, so
        # it would write itself into Record-Route as 0.0.0.0 and every
        # in-dialog request afterwards would be routed to nowhere. The name
        # is what both the harness and FreeSWITCH resolve on this network.
        record_route_preset("opensips:5060");
        $du = "sip:freeswitch:5090";
        route(RELAY);
        exit;
    }

    sl_send_reply(405, "Method Not Allowed");
}

route[REGISTRAR] {
    if ($fU != "labuser") {
        sl_send_reply(403, "Forbidden");
        exit;
    }
    $var(auth_user) = "labuser";
    $var(auth_pass) = "labpass";
    if (!pv_www_authorize("sipral.test")) {
        www_challenge("sipral.test", "auth");
        exit;
    }
    if (!save("location")) {
        sl_reply_error();
    }
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
