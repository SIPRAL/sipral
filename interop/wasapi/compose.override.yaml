#
# Makes the lab's Asterisk reachable from another machine on the LAN, for a
# call carried on real devices (interop/harness/src/wasapi.rs,
# docs/11-testing.md). Applied with `-f`, on top of ../compose.yaml, never in
# place of it: that file publishes no ports by default because one of the
# machines it also runs on has a production PBX already using 5060 on the
# host, and a compose file that published it would fight that PBX for it.
# `scripts/lab.sh wasapi up` is what applies this one, and only while its own
# run needs it.
#
# rtp.conf narrows Asterisk's RTP range from the image's default (10000-20000,
# twenty thousand ports) to twenty, because a Docker port mapping is one
# iptables rule per port and twenty thousand of them is not a mapping, it is
# a denial of service against the host's own netfilter. Twenty is more than
# one echo call ever opens at once.
#
# pjsip_local.conf here is `scripts/lab.sh wasapi up`'s own, generated fresh
# each time it runs (gitignored: see this directory's own comment in
# .gitignore) with the address this machine is reachable at on the LAN,
# which nothing checked into the repository can know in advance. It also
# moves Asterisk's own SIP socket to 5062, so that the port is published one
# to one. Published as 5062 onto the 5060 inside, the answers to what a
# client sent still left from 5062, since the NAT that forwarded the request
# rewrites its replies, but a request Asterisk starts itself -- the INVITE of
# a call to a registered phone -- left the host from 5060. A phone behind a
# NAT that filters by address and port has opened a way in only for the
# address and port it sent its REGISTER to, and dropped that INVITE: the
# phone never rang.
services:
  asterisk:
    ports:
      - "5062:5062/udp"
      - "10000-10020:10000-10020/udp"
    volumes:
      - ./wasapi/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./wasapi/pjsip_local.generated.conf:/etc/asterisk/pjsip_local.conf:ro
