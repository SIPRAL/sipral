;
; Narrows the image's default RTP range (10000-20000) to what
; compose.override.yaml actually publishes, so a Docker port mapping is
; twenty iptables rules rather than twenty thousand. One echo call needs one
; pair; twenty leaves room for a run that did not tear the last one down
; cleanly.
[general]
rtpstart=10000
rtpend=10020
