;
; RFC 3261 section 18.1.1, for scripts/lab.sh's `datagram` step alone
; (interop/datagram/compose.override.yaml mounts this over the empty
; default): a request that answers Asterisk's challenge and comes out larger
; than a datagram may carry. Two ways in: 5060, where TCP listens beside the
; UDP pjsip.conf already binds, so the stack can take the request there over
; a connection it opens itself; and 5070, UDP and nothing else, where the
; connection is refused and the stack has only the datagram.

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-udp-only]
type=transport
protocol=udp
bind=0.0.0.0:5070

; The account the caller places its calls from. Its INVITEs are challenged,
; as every request from an endpoint with auth is, and it takes SDES the way
; labuser-srtp does, so the offer that makes the request large is one it
; answers.
[labuser-big]
type=auth
auth_type=userpass
username=labuser-big
password=labpass

[labuser-big]
type=aor
max_contacts=10

[labuser-big]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-big
aors=labuser-big
disallow=all
allow=ulaw
allow=alaw
media_encryption=sdes
