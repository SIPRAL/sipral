;
; Asterisk's HTTP server, which is where a SIP WebSocket arrives
; (res_http_websocket, on /ws). NOT the default: the image ships it bound to
; 127.0.0.1 alone, which nothing on the lab network reaches. Plain HTTP on
; 8088, the port Asterisk's own documentation uses; no TLS listener, since
; the lab's WebSocket step is the plain one (pjsip.conf's transport-ws).
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
