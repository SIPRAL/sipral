[lab]
; Dialled into a local channel rather than answering and playing on its own.
; A channel that answers by itself is a one-legged call, and neither server
; here will transfer one — there has to be somebody on the other side to hand
; the call over to.
exten => 9000,1,Dial(Local/9002@lab)
 same => n,Hangup()

; Cadenced rather than continuous, for the reason the FreeSWITCH side gives at
; length: a far end that never stops speaking never lets the receiving buffer
; give back the delay it grew over an interruption, and every measurement over
; an impaired link is then taken against a buffer stuck at its worst moment.
; 1200 ms of tone, 600 ms of silence, repeating.
exten => 9002,1,Answer()
 same => n,Playtones(350+440/1200,0/600)
 same => n,Wait(60)
 same => n,Hangup()

; somewhere for a transfer to go. A different tone, so a capture says which
; leg is which without reading the SDP
exten => 9001,1,Answer()
 same => n,Playtones(busy)
 same => n,Wait(60)
 same => n,Hangup()

; 8.5.1's RFC 4733 DTMF flow, and 8.3.11's INFO one. Read() collects one
; digit however it arrived — chan_pjsip normalises a telephone-event and a
; SIP INFO digit to the same internal frame before Read() ever sees one, so
; this one extension confirms either form the stack sends with. The digit is
; named straight back with SendDTMF(), which follows each endpoint's own
; dtmf_mode: a telephone-event for `labuser` above (dtmf_mode unset, and
; rfc4733 is res_pjsip's own default) and an INFO for `labuser-infodtmf`
; (interop/asterisk/pjsip.conf), so the reply exercises this stack's
; receiving half over INFO too.
exten => 9003,1,Answer()
 same => n,Read(digit,,1,,1,5)
 same => n,SendDTMF(${digit})
 same => n,Hangup()

; 8.5.1's SRTP flow, registered as labuser-srtp: the same bridge as 9000, on
; its own number so a capture shows which leg negotiated encryption without
; reading the SDP.
exten => 9004,1,Dial(Local/9002@lab)
 same => n,Hangup()

; 8.6.12's DTLS-SRTP flow, registered as labuser-dtls: the same bridge again,
; on its own number so a capture shows which leg keyed by handshake without
; reading the SDP.
exten => 9005,1,Dial(Local/9002@lab)
 same => n,Hangup()

; 8.6.5's MESSAGE flow (RFC 3428). Echoes the body back to whoever sent it,
; prefixed so a capture can tell the echo from the original without reading
; the Call-ID. res_pjsip_messaging routes an out-of-dialog MESSAGE through
; the endpoint's own dialplan context exactly like a call, keyed off the
; Request-URI's user part -- there is no separate "message context" set
; anywhere in pjsip.conf, so this runs for a MESSAGE from any endpoint in
; [lab], not `labuser` alone. MESSAGE(from) is the sender's address as
; received; prefixing it with pjsip: is the documented way to hand it back
; to MessageSend() as a destination.
exten => 9006,1,NoOp(MESSAGE from ${MESSAGE(from)}: ${MESSAGE(body)})
 same => n,Set(MESSAGE(body)=echo: ${MESSAGE(body)})
 same => n,MessageSend(pjsip:${MESSAGE(from)},${MESSAGE(to)})
 same => n,Hangup()

; 8.6.5's message waiting indication flow (RFC 3842), registered as
; labuser-mwi (interop/asterisk/pjsip.conf), whose mailboxes= names
; 9007@default (interop/asterisk/voicemail.conf). A call into this
; extension is app_voicemail recording a message into that mailbox; hanging
; up ends the recording. res_pjsip_mwi watches the mailbox by itself and
; NOTIFYs every subscriber of message-summary for it, unsolicited or not,
; the moment app_voicemail saves what was recorded.
exten => 9007,1,Answer()
 same => n,VoiceMail(9007@default,u)
 same => n,Hangup()
