[lab]
; Dialled into a local channel rather than answering and playing on its own.
; A channel that answers by itself is a one-legged call, and neither server
; here will transfer one — there has to be somebody on the other side to hand
; the call over to.
exten => 9000,1,Dial(Local/9002@lab)
 same => n,Hangup()

; Cadenced rather than continuous, for the reason the FreeSWITCH side gives at
; length: a far end that never stops speaking never lets the receiving buffer
; give back the delay it grew over an interruption, and every measurement over
; an impaired link is then taken against a buffer stuck at its worst moment.
; 1200 ms of tone, 600 ms of silence, repeating.
exten => 9002,1,Answer()
 same => n,Playtones(350+440/1200,0/600)
 same => n,Wait(60)
 same => n,Hangup()

; somewhere for a transfer to go. A different tone, so a capture says which
; leg is which without reading the SDP
exten => 9001,1,Answer()
 same => n,Playtones(busy)
 same => n,Wait(60)
 same => n,Hangup()

; 8.5.1's RFC 4733 DTMF flow, and 8.3.11's INFO one. Read() collects one
; digit however it arrived — chan_pjsip normalises a telephone-event and a
; SIP INFO digit to the same internal frame before Read() ever sees one, so
; this one extension confirms either form the stack sends with. The digit is
; named straight back with SendDTMF(), which follows each endpoint's own
; dtmf_mode: a telephone-event for `labuser` above (dtmf_mode unset, and
; rfc4733 is res_pjsip's own default) and an INFO for `labuser-infodtmf`
; (interop/asterisk/pjsip.conf), so the reply exercises this stack's
; receiving half over INFO too.
exten => 9003,1,Answer()
 same => n,Read(digit,,1,,1,5)
 same => n,SendDTMF(${digit})
 same => n,Hangup()

; 8.5.1's SRTP flow, registered as labuser-srtp: the same bridge as 9000, on
; its own number so a capture shows which leg negotiated encryption without
; reading the SDP.
exten => 9004,1,Dial(Local/9002@lab)
 same => n,Hangup()

; 8.6.12's DTLS-SRTP flow, registered as labuser-dtls: the same bridge again,
; on its own number so a capture shows which leg keyed by handshake without
; reading the SDP.
exten => 9005,1,Dial(Local/9002@lab)
 same => n,Hangup()

; 8.6.5's MESSAGE flow (RFC 3428). Echoes the body back to whoever sent it,
; prefixed so a capture can tell the echo from the original without reading
; the Call-ID. res_pjsip_messaging routes an out-of-dialog MESSAGE through
; the endpoint's own dialplan context exactly like a call, keyed off the
; Request-URI's user part -- there is no separate "message context" set
; anywhere in pjsip.conf, so this runs for a MESSAGE from any endpoint in
; [lab], not `labuser` alone. MESSAGE(from) is the sender's address as
; received, `<sip:labuser@asterisk>`, and MessageSend() takes an endpoint's
; name after pjsip:, not an address: handed the address it answers "Could not
; find endpoint '<sip:labuser@asterisk>'" and sends nothing, which is how the
; first run of this flow failed. So the user part is cut out of it — the
; endpoints here are named after their users — and the echo goes to that
; endpoint's registered contact, from this extension.
exten => 9006,1,NoOp(MESSAGE from ${MESSAGE(from)}: ${MESSAGE(body)})
 same => n,Set(SENDER=${CUT(CUT(MESSAGE(from),@,1),:,2)})
 same => n,Set(MESSAGE(body)=echo: ${MESSAGE(body)})
 same => n,MessageSend(pjsip:${SENDER},sip:9006@asterisk)
 same => n,Hangup()

; 8.6.5's message waiting indication flow (RFC 3842), registered as
; labuser-mwi (interop/asterisk/pjsip.conf), whose AOR's mailboxes= names
; 9007@default (interop/asterisk/voicemail.conf). A call into this
; extension stands for leaving a message: when the caller hangs up, the
; mailbox is announced as holding one new message, and res_pjsip_mwi NOTIFYs
; every subscriber of message-summary for it.
;
; Not VoiceMail() recording one, which is what this was first written as:
; the image ships no sound files, so VoiceMail() fails on its own greeting
; ("File vm-theperson does not exist in any format") and hangs up before a
; frame is recorded, and the count never moves. MinivmMWI() publishes the
; mailbox's state directly, which is all this flow reads back, and it does
; so from a hangup handler so that the count moves after the call, the way
; it would after a message was really left.
exten => 9007,1,Answer()
 same => n,Set(CHANNEL(hangup_handler_push)=mwi-left,s,1)
 same => n,Wait(30)
 same => n,Hangup()

; The local-conference join flow's own second leg (interop/harness's own
; join.rs, interop/harness-c's own run_join): says nothing on its own and
; sends back only whatever audio it is sent, which is what lets the harness
; prove that the tone extension's own audio crossed to this call's wire
; without carrying a second G.711 decoder of its own to read either call's
; payload -- see interop/harness/src/join.rs's module documentation for the
; whole of the reasoning. Its own number rather than a third use of 9000,
; so a capture shows which leg is which without reading the SDP, the same
; reason 9001 and 9004 each have their own. The G.729 flow dials it too, as
; `labuser-g729` (pjsip.conf): Echo() writes back the frames it reads, and on
; a channel that is G.729 both ways, with no translator in the image, those
; are the caller's own encoded frames.
exten => 9008,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; The NAT step's call the other way (scripts/lab.sh's nat_flow): Asterisk
; calls a client registered from behind interop/nat's NAT, and once it has
; answered, echoes it for eight seconds and hangs up. Reached only by the
; `channel originate` there. Echo() sends nothing it was not sent, so audio
; back at the client is audio that crossed both ways; and the hangup is
; Asterisk's, so its BYE, like its ACK before it, goes where the client's
; 2xx `Contact` said rather than where its SDP did.
exten => 9010,1,Set(TIMEOUT(absolute)=8)
 same => n,Echo()
 same => n,Hangup()

; The comparison with PJSIP (interop/compare/compare.sh): every call
; Asterisk originates at a client under comparison runs this once the client
; has answered. The same cadenced tone as 9002, for as long as the
; comparison needs the call up -- it hangs the calls up itself, all at once,
; with `channel request hangup all`; the Wait() is a backstop.
exten => 9020,1,Answer()
 same => n,Playtones(350+440/1200,0/600)
 same => n,Wait(900)
 same => n,Hangup()

; The in-band digit flow, dialled as labuser-inband (pjsip.conf): four digits
; read from the audio, then written back into it. Read()'s own `#` ends the
; input, so the flow dials none.
exten => 9030,1,Answer()
 same => n,Read(digits,,4,,1,8)
 same => n,SendDTMF(${digits})
 same => n,Wait(2)
 same => n,Hangup()

; The answering machine flow: ringback on early media, then an answer, the
; greeting and the beep `sipral-interop --write-greeting` wrote, which
; scripts/lab.sh copies into this container's /tmp before the call.
exten => 9031,1,Progress()
 same => n,Playtones(ring)
 same => n,Wait(10)
 same => n,StopPlaytones()
 same => n,Answer()
 same => n,Playback(/tmp/sipral-greeting)
 same => n,Wait(1)
 same => n,Playback(/tmp/sipral-beep)
 same => n,Wait(3)
 same => n,Hangup()

; Run once, when a 9007 call ends. Its own context, since an `h` extension
; in [lab] would run after every call the lab takes.
;
; MinivmMWI() publishes a count, not an increment, so the count is kept here
; and goes up by one per call. Publishing 1 every time was enough for the
; first flow of a lab run and not for the second: the Rust driver's call
; left the count at 1, and the C driver, run next against the same
; container, read 1 before its call and 1 after. The leading 0 makes an
; unset variable read as zero.
[mwi-left]
exten => s,1,Set(GLOBAL(MWI_LEFT)=$[0${GLOBAL(MWI_LEFT)} + 1])
 same => n,MinivmMWI(9007@default,0,${GLOBAL(MWI_LEFT)},0)
 same => n,Return()

; What the lab plays at the Python example agent once it has answered: a
; tone for it to hear and echo, then the digits it hangs up on. Reached only
; by the `channel originate` in scripts/lab.sh, never by dialling. A tone
; rather than a recording for the same reason as 9007: the image ships no
; sound files. The Hangup() at the end is a backstop; the agent hangs up on
; the "#" first, and the lab reads which of the two ended it.
[agent-call]
exten => s,1,Playtones(440)
 same => n,Wait(3)
 same => n,StopPlaytones()
 same => n,SendDTMF(12#,250)
 same => n,Wait(10)
 same => n,Hangup()
