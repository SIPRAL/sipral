; Everything here is either structurally required — a transport needs an
; address, an endpoint needs a context, auth needs credentials — or left at
; Asterisk's default. The two lines that are not are marked, and both are
; defaults that make a working client look broken.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; NOT structural, and not a default either. res_pjsip knows no domain of its
; own, so a blind REFER whose Refer-To names one — which is what a client that
; registered to `asterisk` will send — is answered 400 and reported as a failed
; transfer in the sipfrag. An attended REFER is unaffected, because Replaces
; names a dialog rather than a place to route to.
[asterisk]
type=domain_alias
domain=asterisk

[labuser]
type=auth
auth_type=userpass
username=labuser
password=labpass

[labuser]
type=aor
; NOT the default. max_contacts is unset out of the box, which means zero, and
; res_pjsip then refuses every REGISTER. It is a server setting and it gets
; blamed on the client every time.
;
; Ten rather than one because each flow in the harness binds a fresh port and
; so arrives with a Contact the last one did not use. One binding per account
; is a real deployment choice; it is not the thing under test here.
max_contacts=10

[labuser]
type=endpoint
transport=transport-udp
context=lab
auth=labuser
aors=labuser
; NOT the default either. allow is empty out of the box, so an endpoint offers
; no codecs at all and a client offering G.711 sees what looks like its own
; codec mismatch.
disallow=all
allow=ulaw
allow=alaw

; 8.5.1's SRTP flow, kept as an endpoint of its own rather than turning
; media_encryption on above: this way the plain five flows above are
; untouched by it, and a capture can tell the two apart by which account
; registered rather than by reading the SDP.
[labuser-srtp]
type=auth
auth_type=userpass
username=labuser-srtp
password=labpass

[labuser-srtp]
type=aor
max_contacts=10

[labuser-srtp]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-srtp
aors=labuser-srtp
disallow=all
allow=ulaw
allow=alaw
; NOT the default: SDES is off (`no`) unless an endpoint asks for it. This one
; does, for the one flow that has to run under it.
media_encryption=sdes

; 8.6.12's DTLS-SRTP flow, an endpoint of its own for the same reason the
; SDES one above is: every other flow above stays untouched by it, and a
; capture can tell which leg keyed by handshake from which leg used a key
; carried in the SDP without reading either one.
[labuser-dtls]
type=auth
auth_type=userpass
username=labuser-dtls
password=labpass

[labuser-dtls]
type=aor
max_contacts=10

[labuser-dtls]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-dtls
aors=labuser-dtls
disallow=all
allow=ulaw
allow=alaw
; NOT the default: media_encryption is off unless an endpoint asks, and this
; one asks for dtls rather than sdes. dtls_auto_generate_cert makes Asterisk
; mint its own certificate the moment it starts, so the lab needs no
; certificate file of its own to keep or to anonymise. dtls_verify=fingerprint
; checks only the fingerprint the SDP carries against what the handshake
; presents -- the whole of what RFC 8122 §5 and RFC 5763 §5 ask a peer to
; check, since DTLS-SRTP has no certificate authority behind it to check
; instead. dtls_setup=actpass is what this endpoint writes when it is the one
; offering, as RFC 8842 §5.2 and §5.5 ask of every offer; answering this
; stack's own actpass it takes a role, and the hold and the resume this flow
; takes are two more actpass offers whose answers must keep that role (§5.3),
; which is what the flow is there to see. rtcp_mux is off by
; default too: this stack runs one DTLS association per call, over the one
; port its RTP and RTCP already share (RFC 5764 §4.2), and refuses a DTLS
; call the far end will not multiplex rather than opening a second one.
media_encryption=dtls
dtls_auto_generate_cert=yes
dtls_verify=fingerprint
dtls_setup=actpass
rtcp_mux=yes

; 8.3.11's INFO DTMF flow, an endpoint of its own for the same reason the
; SRTP one is: dtmf_mode is unset (rfc4733) on `labuser` above, and this is
; the one flow that needs the other value. SendDTMF() on extension 9003
; (interop/asterisk/extensions.conf) then echoes the digit back over INFO
; too, rather than as a telephone-event, so this end's own receiving half
; (8.3.11(b)) is exercised against a real peer and not only its sending one.
[labuser-infodtmf]
type=auth
auth_type=userpass
username=labuser-infodtmf
password=labpass

[labuser-infodtmf]
type=aor
max_contacts=10

[labuser-infodtmf]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-infodtmf
aors=labuser-infodtmf
disallow=all
allow=ulaw
allow=alaw
; NOT the default: dtmf_mode is rfc4733 unless an endpoint asks otherwise.
; This one asks for INFO so extension 9003's SendDTMF() answers this end's
; INFO with one of its own.
dtmf_mode=info

; The in-band flows (interop/harness/src/inband.rs): no telephone event
; offered or taken on this endpoint, so a digit either end sends is two tones
; in the audio or nothing, and extension 9030's Read() hears a digit only if
; the tones were really there.
[labuser-inband]
type=auth
auth_type=userpass
username=labuser-inband
password=labpass

[labuser-inband]
type=aor
max_contacts=10

[labuser-inband]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-inband
aors=labuser-inband
disallow=all
allow=ulaw
dtmf_mode=inband

; 8.6.5's message waiting indication flow, an endpoint of its own for the
; same reason the SRTP one is: `mailboxes` ties this account's AOR to one
; mailbox, and no other account here should be read against it.
[labuser-mwi]
type=auth
auth_type=userpass
username=labuser-mwi
password=labpass

[labuser-mwi]
type=aor
max_contacts=10
; On the AOR, not the endpoint: res_pjsip_mwi takes a SUBSCRIBE to
; `message-summary` against the AOR it names, and reads the mailboxes the
; AOR lists. The first run of this flow had the option on the endpoint,
; where it means something else — NOTIFYs sent unasked, for a phone that
; never subscribes — and every SUBSCRIBE was answered 404. See
; interop/asterisk/voicemail.conf for mailbox 9007 itself, and extension
; 9007 in interop/asterisk/extensions.conf for what leaves a message in it.
mailboxes=9007@default

[labuser-mwi]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-mwi
aors=labuser-mwi
disallow=all
allow=ulaw
allow=alaw

; The Python binding's example agent, bindings/python/examples/agent.py, run
; by scripts/lab.sh as it ships and called from [agent-call] in
; extensions.conf. An account of its own so that the one call the lab places
; to it cannot land on a harness flow's registration, or one of theirs on it.
[labuser-agent]
type=auth
auth_type=userpass
username=labuser-agent
password=labpass

[labuser-agent]
type=aor
max_contacts=10

[labuser-agent]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-agent
aors=labuser-agent
disallow=all
allow=ulaw
allow=alaw

; 8.5.4's socket-framed agent: `crates/sipral/examples/headless-socket-agent.rs`
; carries the call, `crates/sipral-headless/examples/agent.rs` answers it over
; a plain TCP socket in `sipral-headless`'s own wire protocol. Run by
; scripts/lab.sh's own `headless_socket_agent`, called from [agent-call] the
; same as [labuser-agent] above — a second account so the one call each gets
; cannot land on the other's registration.
[labuser-agent-headless]
type=auth
auth_type=userpass
username=labuser-agent-headless
password=labpass

[labuser-agent-headless]
type=aor
max_contacts=10

[labuser-agent-headless]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-agent-headless
aors=labuser-agent-headless
disallow=all
allow=ulaw
allow=alaw

; The Swift binding's own lab agent, `bindings/swift`'s `SipralLabAgent`
; executable target: the same shape as [labuser-agent] above, carried
; through the Swift idiomatic layer (`SipralStack`/`Account`/`Call`/`Media`)
; instead of the Python one. Run by scripts/lab.sh's own `swift_agent`,
; called from [agent-call] — a third account so the one call each gets
; cannot land on another's registration.
[labuser-agent-swift]
type=auth
auth_type=userpass
username=labuser-agent-swift
password=labpass

[labuser-agent-swift]
type=aor
max_contacts=10

[labuser-agent-swift]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-agent-swift
aors=labuser-agent-swift
disallow=all
allow=ulaw
allow=alaw

; The Kotlin binding's own headless agent, bindings/kotlin/examples/Agent.kt,
; over org.sipral.idiomatic on a JVM. Run by scripts/lab.sh's
; kotlin_agent and called from [agent-call] the same as [labuser-agent]
; above — a third account so the one call each gets cannot land on
; another's registration.
[labuser-agent-kotlin]
type=auth
auth_type=userpass
username=labuser-agent-kotlin
password=labpass

[labuser-agent-kotlin]
type=aor
max_contacts=1
remove_existing=yes

[labuser-agent-kotlin]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-agent-kotlin
aors=labuser-agent-kotlin
disallow=all
allow=ulaw
allow=alaw

; 8.6.3's .NET binding: bindings/dotnet/samples/Sipral.Sample.Agent, the same
; headless echo-and-hang-up-on-"#" shape as [labuser-agent] above, run by
; scripts/lab.sh's own `csharp_agent`, called from [agent-call] the same way
; -- a third account so the one call each gets cannot land on another's
; registration.
[labuser-agent-csharp]
type=auth
auth_type=userpass
username=labuser-agent-csharp
password=labpass

[labuser-agent-csharp]
type=aor
max_contacts=10

[labuser-agent-csharp]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-agent-csharp
aors=labuser-agent-csharp
disallow=all
allow=ulaw
allow=alaw

; 8.6.15's G.729 flow, an endpoint of its own for the same reason the SRTP
; one is: it is the one account here that allows G.729, so no other flow's
; offer can settle on it. G.729 and nothing else, so an offer from this
; stack that named anything beside it could not quietly fall back. The image
; has no G.729 translator; the codec is allowed as a format Asterisk passes
; through, and extension 9008's Echo() hands the frames back on a channel
; that is G.729 both ways, so the audio that returns is this stack's own
; encoder's, decoded by this stack's own decoder.
; A phone behind a NAT and nothing else: the Android emulator behind its own
; NAT, the iOS Simulator behind the path the Mac reaches the lab over, and
; every handset on a mobile network. Neither asks a STUN server, so the
; Contact it registers and the c= it offers are its private addresses.
[labuser-mobile]
type=auth
auth_type=userpass
username=labuser-mobile
password=labpass

[labuser-mobile]
type=aor
; One phone at a time on this account, the latest to register, so a call
; placed to it rings that phone and not a binding a previous run left.
max_contacts=1
remove_existing=yes

[labuser-mobile]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-mobile
aors=labuser-mobile
disallow=all
allow=ulaw
allow=alaw
; NOT the default, either of them, and both what a registrar facing phones
; behind NATs is configured with (docs/06-nat.md, "The order that matters").
; rewrite_contact keeps the address and port a REGISTER actually came from
; as the binding, where the default keeps the private Contact it names and
; sends an incoming INVITE there, to an address nothing outside the NAT
; routes to. rtp_symmetric sends the call's audio back to where the phone's
; own audio comes from, where the default sends it to the private c=.
rewrite_contact=yes
rtp_symmetric=yes

[labuser-g729]
type=auth
auth_type=userpass
username=labuser-g729
password=labpass

[labuser-g729]
type=aor
max_contacts=10

[labuser-g729]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-g729
aors=labuser-g729
disallow=all
allow=g729

; The comparison with PJSIP (interop/compare/, docs/23-compared-with-pjsip.md):
; one account both clients register as in turn, so Asterisk treats them
; exactly alike and every call it originates for the comparison goes to
; whichever one is registered now. NOT the default: one binding, and a new
; REGISTER replaces the last client's rather than being refused, so the
; second client never inherits the first one's contact.
[labuser-compare]
type=auth
auth_type=userpass
username=labuser-compare
password=labpass

[labuser-compare]
type=aor
max_contacts=1
remove_existing=yes

[labuser-compare]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-compare
aors=labuser-compare
disallow=all
allow=ulaw
allow=alaw

; At the end, not next to the transport it is written for: `(+)` appends to
; a category already declared earlier in the file, and by this point every
; category above has been. `(+)` finds a target category by name alone, and
; `labuser` is declared three times under three different `type=` (auth,
; aor, endpoint) — so a section here named `[labuser](+)` lands on the
; first of the three, not the endpoint, which is a trap worth knowing about
; rather than one to fall into: `interop/wasapi/`'s own NAT fields go on
; `[transport-udp]`, which is declared once, for exactly this reason. Empty
; by default; interop/wasapi/compose.override.yaml mounts a different file
; at this same path, only for its own run.
#include pjsip_local.conf
