;
; Everything here is either structurally required — a transport needs an
; address, an endpoint needs a context, auth needs credentials — or left at
; Asterisk's default. The two lines that are not are marked, and both are
; defaults that make a working client look broken.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[labuser]
type=auth
auth_type=userpass
username=labuser
password=labpass

[labuser]
type=aor
; NOT the default. max_contacts is unset out of the box, which means zero, and
; res_pjsip then refuses every REGISTER. It is a server setting and it gets
; blamed on the client every time.
;
; Ten rather than one because each flow in the harness binds a fresh port and
; so arrives with a Contact the last one did not use. One binding per account
; is a real deployment choice; it is not the thing under test here.
max_contacts=10

[labuser]
type=endpoint
transport=transport-udp
context=lab
auth=labuser
aors=labuser
; NOT the default either. allow is empty out of the box, so an endpoint offers
; no codecs at all and a client offering G.711 sees what looks like its own
; codec mismatch.
disallow=all
allow=ulaw
allow=alaw
