;
; One mailbox, for 8.6.5's message waiting indication flow. Everything else
; is app_voicemail's own default: no mail server configured, so a message
; stays as a recording under /var/spool/asterisk/voicemail and is never
; emailed anywhere, which is the point for a lab that is torn down and
; rebuilt.

[general]
; NOT the default (3 seconds): the flow leaves a short recording and a
; message discarded as too short would never move the mailbox's own count,
; which is the one thing this flow reads back.
minmessage=0
; the greeting and the beep are Asterisk's own core sound files and do not
; need maxgreet or a review step for an automated caller that never listens
; to either

[default]
; mailbox => password,fullname,email
; No email: nothing above configures a mail server to send it through, and a
; lab account does not need one.
9007 => 1234,Lab User,
