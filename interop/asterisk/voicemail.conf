;
; One mailbox, for 8.6.5's message waiting indication flow. app_voicemail
; owns it and reports its state, empty, when a subscription first asks; the
; new message the flow waits for is announced by extension 9007's hangup
; handler (interop/asterisk/extensions.conf), because this image carries no
; sound files and VoiceMail() cannot record without its greeting. Everything
; else is app_voicemail's own default, with no mail server configured.

[general]

[default]
; mailbox => password,fullname,email
; No email: nothing above configures a mail server to send it through, and a
; lab account does not need one.
9007 => 1234,Lab User,
