#
# The one thing `scripts/interop-matrix.py` cannot read out of a lab run: which
# flows stand for which feature, and whether that feature is implemented and
# unit-tested at all. Interop-tested is not asked here -- the generator
# derives it from the matrix itself, by checking whether every listed flow
# has a passing result against some peer. A feature with no flow (nothing
# below runs it against a live peer) reads "n/a" there rather than "no": the
# two mean different things, and the second would be a claim this file does
# not make.
#
# Kept small and hand-written on purpose, the way fixtures/rfc4475/manifest.toml
# is: a line here is a fact somebody checked, not a derivation. `implemented`
# and `unit_tested` are exactly that -- edit them when the fact changes, not
# when a lab run does.
#
# Shape the generator expects, and nothing more general than this: repeated
#
#   [[feature]]
#   name = "..."
#   implemented = true|false
#   unit_tested = true|false
#   flows = ["...", "..."]
#
# blocks, in the order they should print. A flow name is exactly what
# `interop/harness` prints for it (`Flow::name()` in `interop/harness/src/main.rs`,
# or the literal strings `main.rs` prints for "local conference", "inbound,
# narrowed" and "forked, the second phone answering first"), before `scripts/interop-matrix.py` appends " (C ABI)" for the C
# driver's own row -- that suffix is stripped again before the two are
# compared, so one flow name here covers both drivers, and, for the four
# `netem` rows, before the generator appends the impairment profile's own
# name in parentheses.

