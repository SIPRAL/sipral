#!KAMAILIO
# SPDX-License-Identifier: AGPL-3.0-only OR LicenseRef-Sipral-Commercial
# Copyright (c) 2026 Sytek
#
# One static account, no database, and everything that is not a REGISTER
# relayed to FreeSWITCH. Record-Route so that the in-dialog requests a call
# makes afterwards — the ACK, hold, the BYE — come back through here, which is
# the point of testing against a proxy at all.

log_stderror=yes
log_facility=LOG_LOCAL0
# yes, with the image's own `kamailio -DD -E`: -DD keeps the process that
# started in the foreground as the container's PID 1 while the children do
# the work. `fork=no` was this file's first answer to a container that exited
# once the proxy was up, and it costs every transport but the first UDP
# socket -- no TCP, so no WebSocket for the `browser` step
fork=yes
children=1
# advertise, not the bare wildcard: without it the socket writes
# "0.0.0.0" into the Via it adds on every request it relays, which is not
# an address anybody downstream can answer to. CANCEL is what makes this
# visible first -- the far end's 487 to the original INVITE has nowhere to
# go back to, so the proxy never sees it, times the transaction out itself,
# and retransmits the CANCEL three times before it gives up.
listen=udp:0.0.0.0:5060 advertise kamailio:5060
# SIP over WebSocket (RFC 7118), plain, for the browser in scripts/lab.sh's
# `browser` step: the HTTP upgrade arrives on this TCP socket, and the
# handshake is the websocket module's (event_route[xhttp:request] below).
# A WebSocket's handshake carries no Content-Length, which TCP would
# otherwise wait for
listen=tcp:0.0.0.0:8080 advertise kamailio:8080
tcp_accept_no_cl=yes
dns=no
rev_dns=no
auto_aliases=no
# without this the proxy does not recognise the name it wrote into Record-Route
# as one of its own, so loose_route() leaves the Route header in place and
# forwards the request back to itself. It is a tight loop, and it takes the ACK
# and the BYE with it. The second is the WebSocket listener's, which a call
# between it and UDP records as well
alias="kamailio"
alias="kamailio:8080"

#!define LAB_USER "labuser"
#!define LAB_PASS "labpass"
#!define LAB_REALM "sipral.test"
# A profile of the lab's own, on a port vanilla does not use. Internal on 5060
# challenges a proxied call with 407; external on 5080 does not, but it runs
# NAT detection and advertises the runner's public address in Contact, so every
# in-dialog request afterwards leaves the network and never comes back.
#!define FS_ADDRESS "freeswitch:5090"
# The same FreeSWITCH on a second profile that reads an offer only once its
# dialplan answers (interop/freeswitch/lab_late_profile.xml), for the one
# extension whose dialplan has to choose the SDES suite first: 9010.
#!define FS_LATE_ADDRESS "freeswitch:5092"
#!define FS_LATE_USER "9010"

# The phone-to-phone peer: baresip, registered here rather than preset
# like FS_ADDRESS above, because a second client stack's contact is not a
# fixed address this file can name in advance -- it is looked up in usrloc
# once baresip has registered it, the same as any other user would be on a
# proxy that kept a database. Three accounts sharing one password, the
# shape interop/baresip/config/accounts explains.
#!define BARESIP_USER "baresip"
#!define BARESIP_USER_SRTP "baresip-srtp"
#!define BARESIP_USER_DTLS "baresip-dtls"
#!define BARESIP_USER_HANGUP "baresip-hangup"
#!define BARESIP_USER_DTMF "baresip-dtmf"
#!define BARESIP_USER_DTMFINFO "baresip-dtmfinfo"
#!define BARESIP_PASS "baresippass"

# The forked user: two stacks of the harness's own fork flow register as it
# at once, from two sockets, and an INVITE to it is relayed to both bindings
# in parallel -- lookup() turns every contact it finds into a branch (the
# registrar's append_branches, on by default), and t_relay() sends them all
# together (RFC 3261 section 16.6). Only a call to this user is forked:
# every other flow dials a user with one binding, or with none and a preset
# destination.
#!define FORK_USER "forked"
#!define FORK_PASS "forkedpass"

# The trickle step's callee (interop/harness/src/trickle.rs): one stack
# registers as it from behind the second NAT, and the step's caller dials it
# through here, so the INFO requests that carry trickled ICE candidates (RFC
# 8840) cross a record-routing proxy inside the dialog, as the ACK and the
# BYE do. Looked up like baresip, one binding.
#!define TRICKLE_USER "trickle"
#!define TRICKLE_PASS "tricklepass"

# The `browser` step's two phones (interop/browser/, interop/harness/src/
# browser.rs): the page in a headless Chromium registers as the first over
# the WebSocket on 8080, the harness's WebRTC line as the second over UDP,
# and each calls the other through here. The proxy carries the signalling
# only; the media goes end to end, and so do the INFO requests that trickle
# the candidates. Looked up like baresip, one binding each.
#!define WEBRTC_BROWSER_USER "webrtc-browser"
#!define WEBRTC_SIPRAL_USER "webrtc-sipral"
#!define WEBRTC_PASS "webrtcpass"

# The members of the harness's local conference flow (nway): three stacks
# each register as one of these, and a fourth calls all three through here
# and mixes them itself. Looked up like baresip, one binding each.
#!define CONF_USER_A "conf-a"
#!define CONF_USER_B "conf-b"
#!define CONF_USER_C "conf-c"
#!define CONF_PASS "confpass"

# The harness's foreignrealm flow: an INVITE to this user is challenged
# with a 407 for a realm other than LAB_REALM -- the shape a proxy passing
# on a far end's own challenge has, or an SBC at the registrar's address
# that challenges calls under a realm of its own. The account registered
# here under LAB_REALM has to decline it rather than give its password to a
# realm that is not its own. An account that names both realms
# (interop/harness-c's tworealms flow) answers it with LAB_USER's password,
# and the call goes on to FOREIGN_REALM_TARGET on FreeSWITCH.
#!define FOREIGN_REALM_USER "realm-elsewhere"
#!define FOREIGN_REALM "elsewhere.test"
#!define FOREIGN_REALM_TARGET "9000"

mpath="/usr/lib/kamailio/modules/"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"
# has_totag() lives here, is_method() in textops, and the pseudo-variables
# this config reads and writes — $fU, $du — need pv; none of the three is core
loadmodule "siputils.so"
loadmodule "textops.so"
loadmodule "pv.so"
# add_contact_alias() and handle_ruri_alias(), for the one caller here that
# sits behind a NAT with no port forwarded and has to be reached inside the
# dialog: the trickle step's, whose callee sends its candidates back in INFO
# requests (see TRICKLE_USER)
loadmodule "nathelper.so"
# the WebSocket listener: xhttp hands the HTTP upgrade to the route below,
# and websocket answers it and frames SIP from then on
loadmodule "xhttp.so"
loadmodule "websocket.so"

modparam("usrloc", "db_mode", 0)
# a phone on a WebSocket names a host under .invalid in its Contact (RFC 7118
# section 5.2), which nobody can resolve: its REGISTER keeps the connection it
# came on (fix_nated_register()), and lookup() sends to that
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("registrar", "received_avp", "$avp(RECEIVED)")
# the module's own default. Each flow in the harness binds a fresh port, so it
# arrives with a Contact the previous one did not use, and a ceiling of one
# makes save() fail and the third flow see a 503. One binding per account is
# not the thing under test here.
modparam("registrar", "max_contacts", 0)

request_route {
    route(REQINIT);

    # a request that came over a WebSocket is answered on its connection,
    # not at the .invalid host its Via names
    if (nat_uac_test("64")) {
        force_rport();
    }

    if (has_totag()) {
        if (loose_route()) {
            # a target add_contact_alias() wrote below goes to where the
            # INVITE came from; any other target is left as it is
            handle_ruri_alias();
            route(RELAY);
        } else {
            sl_send_reply("404", "Not Found");
        }
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    t_check_trans();

    if (is_method("OPTIONS") && uri == myself) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    if (is_method("INVITE")) {
        if ($rU == FOREIGN_REALM_USER) {
            if (!pv_proxy_authenticate(FOREIGN_REALM, LAB_PASS, "0")) {
                proxy_challenge(FOREIGN_REALM, "1");
                exit;
            }
            consume_credentials();
            $rU = FOREIGN_REALM_TARGET;
        }
        # the `browser` step's calls, between the WebSocket and UDP: recorded
        # with the socket on each side (double Record-Route), so each phone's
        # requests inside the dialog reach the proxy on its own transport.
        # The page's Contact is a host under .invalid, so wherever it is
        # written -- this INVITE, if it came over the WebSocket, or the
        # answer, if that does -- it is marked with the connection, and
        # handle_ruri_alias() above sends there
        if ($rU == WEBRTC_BROWSER_USER || $rU == WEBRTC_SIPRAL_USER) {
            record_route();
            if (nat_uac_test("64")) {
                add_contact_alias();
            }
            t_on_reply("WEBSOCKET");
            if (!lookup("location")) {
                sl_send_reply("404", "Not Found");
                exit;
            }
            route(RELAY);
            exit;
        }
        # preset, not record_route(): the proxy listens on the wildcard, so it
        # writes itself into Record-Route as 0.0.0.0 and every in-dialog request
        # afterwards is routed to nowhere. The name is what both the harness and
        # FreeSWITCH resolve on this network.
        record_route_preset("kamailio:5060");
        # the trickle step's caller is behind a NAT that forwards nothing:
        # its Contact is marked with the address its INVITE came from, so
        # the callee's INFO requests inside the dialog reach it through the
        # NAT's mapping, which the INVITE itself opened
        if ($rU == TRICKLE_USER) {
            add_contact_alias();
        }
        if ($rU == BARESIP_USER || $rU == BARESIP_USER_SRTP
                || $rU == BARESIP_USER_DTLS || $rU == BARESIP_USER_HANGUP
                || $rU == BARESIP_USER_DTMF || $rU == BARESIP_USER_DTMFINFO
                || $rU == FORK_USER || $rU == CONF_USER_A || $rU == CONF_USER_B
                || $rU == CONF_USER_C || $rU == TRICKLE_USER) {
            # a real peer, looked up rather than preset: refused outright
            # if it never registered, instead of relayed to nowhere. For
            # FORK_USER, one branch per binding.
            if (!lookup("location")) {
                sl_send_reply("404", "Not Found");
                exit;
            }
        } else if ($rU == FS_LATE_USER) {
            $du = "sip:" + FS_LATE_ADDRESS;
        } else {
            $du = "sip:" + FS_ADDRESS;
        }
        route(RELAY);
        exit;
    }

    # MESSAGE (RFC 3428) and SUBSCRIBE (RFC 6665), as the PBX behind a proxy
    # gets them: to a user registered here, that user's binding, which is
    # how FreeSWITCH's echo of a MESSAGE reaches the harness; anything else
    # to FreeSWITCH, which answers the lab's 9006 and a mailbox's
    # message-summary
    if (is_method("MESSAGE")) {
        if (!lookup("location")) {
            $du = "sip:" + FS_ADDRESS;
        }
        route(RELAY);
        exit;
    }
    if (is_method("SUBSCRIBE")) {
        record_route_preset("kamailio:5060");
        $du = "sip:" + FS_ADDRESS;
        route(RELAY);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1518", "7")) {
        exit;
    }
}

route[REGISTRAR] {
    if ($fU == LAB_USER) {
        if (!pv_www_authenticate(LAB_REALM, LAB_PASS, "0")) {
            www_challenge(LAB_REALM, "1");
            exit;
        }
    } else if ($fU == BARESIP_USER || $fU == BARESIP_USER_SRTP
            || $fU == BARESIP_USER_DTLS || $fU == BARESIP_USER_HANGUP
            || $fU == BARESIP_USER_DTMF || $fU == BARESIP_USER_DTMFINFO) {
        if (!pv_www_authenticate(LAB_REALM, BARESIP_PASS, "0")) {
            www_challenge(LAB_REALM, "1");
            exit;
        }
    } else if ($fU == FORK_USER) {
        if (!pv_www_authenticate(LAB_REALM, FORK_PASS, "0")) {
            www_challenge(LAB_REALM, "1");
            exit;
        }
    } else if ($fU == CONF_USER_A || $fU == CONF_USER_B || $fU == CONF_USER_C) {
        if (!pv_www_authenticate(LAB_REALM, CONF_PASS, "0")) {
            www_challenge(LAB_REALM, "1");
            exit;
        }
    } else if ($fU == TRICKLE_USER) {
        if (!pv_www_authenticate(LAB_REALM, TRICKLE_PASS, "0")) {
            www_challenge(LAB_REALM, "1");
            exit;
        }
    } else if ($fU == WEBRTC_BROWSER_USER || $fU == WEBRTC_SIPRAL_USER) {
        if (!pv_www_authenticate(LAB_REALM, WEBRTC_PASS, "0")) {
            www_challenge(LAB_REALM, "1");
            exit;
        }
    } else {
        sl_send_reply("403", "Forbidden");
        exit;
    }
    if (nat_uac_test("64")) {
        fix_nated_register();
    }
    if (!save("location")) {
        sl_reply_error();
    }
}

# A reply to one of the `browser` step's INVITEs: the page's answer names its
# .invalid Contact too, marked like its INVITE's above.
onreply_route[WEBSOCKET] {
    if (nat_uac_test("64")) {
        add_contact_alias();
    }
}

# The WebSocket's opening handshake (RFC 6455 section 4), an HTTP GET that
# asks to upgrade to the `sip` subprotocol on 8080; anything else over HTTP
# is refused.
event_route[xhttp:request] {
    if ($Rp != 8080) {
        xhttp_reply("403", "Forbidden", "", "");
        exit;
    }
    if ($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm =~ "GET") {
        ws_handle_handshake();
        exit;
    }
    xhttp_reply("404", "Not Found", "", "");
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
