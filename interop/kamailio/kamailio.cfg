#!KAMAILIO
# SPDX-License-Identifier: AGPL-3.0-only OR LicenseRef-Sipral-Commercial
# Copyright (c) 2026 Tiberiu Balasea
#
# One static account, no database, and everything that is not a REGISTER
# relayed to FreeSWITCH. Record-Route so that the in-dialog requests a call
# makes afterwards — the ACK, hold, the BYE — come back through here, which is
# the point of testing against a proxy at all.

log_stderror=yes
log_facility=LOG_LOCAL0
# not yes. Forking makes the process that started leave once its children are
# up, and in a container that process is PID 1 — so the proxy comes up, says it
# is listening, and the container exits a moment later
fork=no
children=1
listen=udp:0.0.0.0:5060
dns=no
rev_dns=no
auto_aliases=no

#!define LAB_USER "labuser"
#!define LAB_PASS "labpass"
#!define LAB_REALM "sipral.test"
# 5080, not 5060. Vanilla FreeSWITCH puts two profiles up: internal on 5060,
# which authenticates every call and answers a proxied one with 407, and
# external on 5080, which does not and whose context is `public` — where the
# lab dialplan already lives. An upstream sending calls in is what the external
# profile is for, so the proxy uses it rather than the lab adding an ACL that
# vanilla would not have.
#!define FS_ADDRESS "freeswitch:5080"

mpath="/usr/lib/kamailio/modules/"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"
# has_totag() lives here, is_method() in textops, and the pseudo-variables
# this config reads and writes — $fU, $du — need pv; none of the three is core
loadmodule "siputils.so"
loadmodule "textops.so"
loadmodule "pv.so"

modparam("usrloc", "db_mode", 0)
# the module's own default. Each flow in the harness binds a fresh port, so it
# arrives with a Contact the previous one did not use, and a ceiling of one
# makes save() fail and the third flow see a 503. One binding per account is
# not the thing under test here.
modparam("registrar", "max_contacts", 0)

request_route {
    route(REQINIT);

    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
        } else {
            sl_send_reply("404", "Not Found");
        }
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    t_check_trans();

    if (is_method("OPTIONS") && uri == myself) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (is_method("REGISTER")) {
        route(REGISTRAR);
        exit;
    }

    if (is_method("INVITE")) {
        record_route();
        $du = "sip:" + FS_ADDRESS;
        route(RELAY);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1518", "7")) {
        exit;
    }
}

route[REGISTRAR] {
    if ($fU != LAB_USER) {
        sl_send_reply("403", "Forbidden");
        exit;
    }
    if (!pv_www_authenticate(LAB_REALM, LAB_PASS, "0")) {
        www_challenge(LAB_REALM, "1");
        exit;
    }
    if (!save("location")) {
        sl_reply_error();
    }
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
