;
; Mounted over ../asterisk/pjsip_local.conf by compose.override.yaml, for
; scripts/lab.sh's ICE-lite step only: the account the headless application
; registers while it answers as an ICE-lite endpoint, called from
; [agent-call] like the other agents' accounts.
;
; ice_support is what the step is for: Asterisk offers ICE and runs the
; checks as the full agent. rtcp_mux because the lite end describes one
; component, the socket it was given, and a stream whose RTCP asked for a
; second one would leave that component unchecked.

[labuser-agent-ice]
type=auth
auth_type=userpass
username=labuser-agent-ice
password=labpass

[labuser-agent-ice]
type=aor
max_contacts=10

[labuser-agent-ice]
type=endpoint
transport=transport-udp
context=lab
auth=labuser-agent-ice
aors=labuser-agent-ice
disallow=all
allow=ulaw
allow=alaw
ice_support=yes
rtcp_mux=yes
