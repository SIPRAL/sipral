# The interop lab. Three servers on default-ish settings, one capture, and the
# harness talking to all of them over a bridge network so that no port has to
# be published to the host — Docker creates one iptables rule per published
# port, and the RTP ranges these servers ship with would be tens of thousands
# of them.
#
# A fourth, opensips, is not one of the three: it carries the `opensips`
# profile, so `docker compose up -d` — no profile named — never starts it.
# It exists only for its own step in `scripts/lab.sh`, brought up with
# `--profile opensips up -d opensips` and torn down with `rm -sf opensips`
# right after, so the lab's steady footprint stays three containers.
#
# The capture is not a service here: it has to join the proxy's network
# namespace, and asking Compose for that makes it restart the proxy first and
# then find the namespace it just invalidated. It is started with a plain
# `docker run --network container:...` once the servers are up.
#
# Images are pinned by version tag rather than latest: `andrius/asterisk:22`
# changed digest six days before this was written, and a lab that moves under
# you is not a lab. Refresh the pins deliberately. opensips/opensips ships no
# tag more specific than the release branch (`4.0`, not `4.0.0`), so that one
# is pinned by tag and digest together, in interop/opensips/Dockerfile.

name: sipral-interop

services:
  kamailio:
    image: ghcr.io/kamailio/kamailio-ci:6.1.4-alpine
    # no command: the image's own entrypoint knows how to start it, and
    # replacing that is how it ends up running and then quietly exiting
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
    networks: [lab]

  # A second opinion on registration and routing through a proxy: Kamailio
  # and OpenSIPS share an ancestor but have diverged for fifteen years, so a
  # rule the two of them agree on is a rule read the same way twice rather
  # than once. Not one of the three the lab keeps up throughout — see the
  # note above.
  opensips:
    # the pinned official image plus the digest-auth package it leaves out;
    # see interop/opensips/Dockerfile
    build:
      context: ./opensips
    profiles: [opensips]
    # no command: the image's own entrypoint is already `opensips -F`, the
    # foreground flag that keeps this from being the same daemonize-and-exit
    # trap kamailio.cfg's own fork=no comment describes
    volumes:
      - ./opensips/opensips.cfg:/etc/opensips/opensips.cfg:ro
    networks: [lab]

  freeswitch:
    image: safarov/freeswitch:1.10.12
    # names vanilla does not use, in directories it includes by glob: the
    # entrypoint copies its own tree over /etc/freeswitch at every start, so
    # anything mounted at one of its paths is a fight it wins. The event
    # socket config is the exception -- mod_event_socket loads exactly one
    # file by that fixed name, not a directory by glob, so this one replaces
    # vanilla's own rather than adding beside it (see its own comment).
    volumes:
      - ./freeswitch/lab_user.xml:/etc/freeswitch/directory/default/lab_user.xml:ro
      - ./freeswitch/lab.xml:/etc/freeswitch/dialplan/public/zz_sipral_lab.xml:ro
      - ./freeswitch/lab_profile.xml:/etc/freeswitch/sip_profiles/zz_sipral_lab.xml:ro
      - ./freeswitch/lab_late_profile.xml:/etc/freeswitch/sip_profiles/zz_sipral_lab_late.xml:ro
      - ./freeswitch/lab_event_socket.conf.xml:/etc/freeswitch/autoload_configs/event_socket.conf.xml:ro
    networks: [lab]

  asterisk:
    image: andrius/asterisk:22.10.1_debian-trixie
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      # 8.6.5's mailbox, for the message waiting indication flow
      - ./asterisk/voicemail.conf:/etc/asterisk/voicemail.conf:ro
      # pjsip.conf's own #include; empty here, so every flow but
      # interop/wasapi's sees the transport unchanged — see that file's
      # comment and interop/wasapi/compose.override.yaml
      - ./asterisk/pjsip_local.conf:/etc/asterisk/pjsip_local.conf:ro
    networks: [lab]

  # The phone-to-phone peer: a second client stack, registered at
  # Kamailio above as a second lab user, rather than another server. Built
  # by compose (interop/baresip/Dockerfile) rather than pulled, since
  # nobody publishes one pinned the way the other three images here are --
  # so the host pays the build once and every run after it starts from the
  # cached layer. A profile of its own, not a fourth container of the
  # ordinary lab: it is the most expensive image here to build, this host
  # already runs a live PBX beside the lab, and scripts/lab.sh starts it for
  # its own step alone and removes it straight after, the way the harness's
  # own tcpdump containers already do.
  baresip:
    build:
      context: ./baresip
    profiles: ["baresip"]
    volumes:
      - ./baresip/config/config:/etc/sipral-baresip/config:ro
      - ./baresip/config/accounts:/etc/sipral-baresip/accounts:ro
    networks: [lab]

  # The same image, a config of its own (interop/baresip/config-hangup's own
  # reasoning): one account, and ctrl_tcp loaded so scripts/lab.sh can make
  # baresip hang its own call up rather than this end asking for it --
  # docs/11-testing.md's "call, ended by the far end", the one row every
  # other phone-to-phone flow in this file proves the opposite of. A
  # container of its own rather than a fourth account beside the other
  # three: this is the only one ctrl_tcp's command port ever reaches, so a
  # command sent here can never land on whichever of the shared peer's own
  # calls happens to be active at the time.
  baresip-hangup:
    build:
      context: ./baresip
    profiles: ["baresip"]
    volumes:
      - ./baresip/config-hangup/config:/etc/sipral-baresip/config:ro
      - ./baresip/config-hangup/accounts:/etc/sipral-baresip/accounts:ro
    networks: [lab]

  # 8.5.5's pair: a STUN server on the lab network, and a NAT between it and
  # a network of its own, `inside`, where scripts/lab.sh's `nat` step puts
  # the C harness. Behind the NAT, what coturn reports for a socket differs
  # from the address the socket is bound to, which is the only way a flow can
  # tell STUN doing its job from STUN doing nothing -- see interop/nat. Both
  # carry the `nat` profile, so a run that does not name that step starts
  # neither and every other flow sees the lab it always saw. coturn is BSD,
  # pinned to the release current on 2026-09-23, and answers Binding
  # requests only (`--stun-only`): nothing here allocates a relay. From 4.18
  # DTLS and the admin CLI are off unless asked for, and `--no-dtls` and
  # `--no-cli` are refused rather than ignored, so they are not here.
  coturn:
    image: coturn/coturn:4.18.0-debian
    profiles: [nat]
    command:
      - -n
      - --stun-only
      - --listening-port=3478
      - --no-tls
      - --log-file=stdout
      - --simple-log
    networks: [lab]

  natbox:
    build:
      context: ./nat
    image: sipral-lab-nat
    profiles: [nat]
    command: ["sh", "/usr/local/bin/sipral-nat-route"]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    networks: [lab, inside]

  # 8.6.16's second NAT, the same image and the same rules, in front of a
  # network of its own: scripts/lab.sh's `ice` step puts one stack behind
  # each, so that neither can reach the other's host candidate and the call
  # has to find its path through both translations (interop/harness's own
  # ice_nat.rs). Same profile, started and removed with the first.
  natbox2:
    build:
      context: ./nat
    image: sipral-lab-nat
    profiles: [nat]
    command: ["sh", "/usr/local/bin/sipral-nat-route"]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    networks: [lab, inside2]

networks:
  lab:
    driver: bridge
  # No way out but the NAT: Docker gives an internal network no route to the
  # host or to any other network, so a packet from `inside` reaches the lab
  # only by way of `natbox`, translated.
  inside:
    driver: bridge
    internal: true
  # `natbox2`'s side, with no route to `inside` either: the two stacks behind
  # the two NATs share nothing but the lab network beyond them.
  inside2:
    driver: bridge
    internal: true
