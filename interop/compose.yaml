# The interop lab. Three servers on default-ish settings, one capture, and the
# harness talking to all of them over a bridge network so that no port has to
# be published to the host — Docker creates one iptables rule per published
# port, and the RTP ranges these servers ship with would be tens of thousands
# of them.
#
# The capture is not a service here: it has to join the proxy's network
# namespace, and asking Compose for that makes it restart the proxy first and
# then find the namespace it just invalidated. It is started with a plain
# `docker run --network container:...` once the servers are up.
#
# Images are pinned by version tag rather than latest: `andrius/asterisk:22`
# changed digest six days before this was written, and a lab that moves under
# you is not a lab. Refresh the pins deliberately.

name: sipral-interop

services:
  kamailio:
    image: ghcr.io/kamailio/kamailio-ci:6.1.4-alpine
    command: ["kamailio", "-DD", "-E", "-f", "/etc/kamailio/kamailio.cfg"]
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
    networks: [lab]

  freeswitch:
    image: safarov/freeswitch:1.10.12
    # names vanilla does not use, in directories it includes by glob: the
    # entrypoint copies its own tree over /etc/freeswitch at every start, so
    # anything mounted at one of its paths is a fight it wins
    volumes:
      - ./freeswitch/lab_user.xml:/etc/freeswitch/directory/default/lab_user.xml:ro
      - ./freeswitch/lab.xml:/etc/freeswitch/dialplan/public/zz_sipral_lab.xml:ro
    networks: [lab]

  asterisk:
    image: andrius/asterisk:22.10.1_debian-trixie
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
    networks: [lab]

networks:
  lab:
    driver: bridge
