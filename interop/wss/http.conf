;
; Asterisk's HTTP server for scripts/lab.sh's `wss` step alone
; (interop/wss/compose.override.yaml mounts it over ../asterisk/http.conf):
; the plain listener on 8088 as before, and a TLS one on 8089, the port
; Asterisk's own documentation uses, where a secure SIP WebSocket arrives on
; /ws. Its certificate is the one lab.sh's tls_certificates makes for
; asterisk.lab.sipral.test, signed by the run's own lab authority.
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/lab-tls/asterisk.pem
tlsprivatekey=/etc/asterisk/lab-tls/asterisk.key
