; SIP over a secure WebSocket (RFC 7118), for scripts/lab.sh's `wss` and
; `browser` steps alone (interop/wss/compose.override.yaml mounts this over
; the empty default). res_pjsip takes a WebSocket that arrived over TLS only on a
; transport of protocol wss; the connections come through the HTTP server's
; TLS listener on 8089 (interop/wss/http.conf), not on the bind below, which
; pjsip requires and the WebSocket ignores.

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

[labuser-wss]
type=auth
auth_type=userpass
username=labuser-wss
password=labpass

[labuser-wss]
type=aor
max_contacts=10

; Plain RTP/AVP, as labuser-ws: the client is a SIP stack, not a browser.
[labuser-wss]
type=endpoint
transport=transport-wss
context=lab
auth=labuser-wss
aors=labuser-wss
disallow=all
allow=ulaw
allow=alaw

; The page's phone in scripts/lab.sh's `browser` step (interop/browser/):
; JsSIP in a headless Chromium, over the same secure WebSocket. A browser's
; endpoint as Asterisk's own guide to WebRTC clients sets one up: webrtc=yes,
; with the certificate Asterisk mints at start. G.711 alone, as the harness's
; WebRTC line it is bridged to offers, so the bridge transcodes nothing; and
; never direct media, so each call's audio crosses Asterisk on both legs,
; which is the path that step reports.
[labuser-browser]
type=auth
auth_type=userpass
username=labuser-browser
password=labpass

[labuser-browser]
type=aor
max_contacts=10

[labuser-browser]
type=endpoint
transport=transport-wss
context=lab
auth=labuser-browser
aors=labuser-browser
disallow=all
allow=ulaw
webrtc=yes
dtls_auto_generate_cert=yes
direct_media=no
