;
; SIP over a secure WebSocket (RFC 7118), for scripts/lab.sh's `wss` step
; alone (interop/wss/compose.override.yaml mounts this over the empty
; default). res_pjsip takes a WebSocket that arrived over TLS only on a
; transport of protocol wss; the connections come through the HTTP server's
; TLS listener on 8089 (interop/wss/http.conf), not on the bind below, which
; pjsip requires and the WebSocket ignores.

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

[labuser-wss]
type=auth
auth_type=userpass
username=labuser-wss
password=labpass

[labuser-wss]
type=aor
max_contacts=10

; Plain RTP/AVP, as labuser-ws: the client is a SIP stack, not a browser.
[labuser-wss]
type=endpoint
transport=transport-wss
context=lab
auth=labuser-wss
aors=labuser-wss
disallow=all
allow=ulaw
allow=alaw
