# A single copyleft dependency would make the commercial licence arm
# undeliverable, so this fails the build rather than warning.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]

[[licenses.exceptions]]
# our own crates, dual-licensed; the AGPL arm is ours to grant
name = "sipral-core"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-ua"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-rtp"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-nat"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-media"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-io-coreaudio"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-headless"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-ffi"
allow = ["AGPL-3.0-only"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
