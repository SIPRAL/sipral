# A single copyleft dependency would make the commercial licence arm
# undeliverable, so this fails the build rather than warning.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]

[[licenses.exceptions]]
# our own crates, dual-licensed; the AGPL arm is ours to grant
name = "sipral"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
# the fuzz harness, which is never distributed
name = "sipral-fuzz"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
# libFuzzer's bindings carry LLVM's old NCSA licence alongside MIT/Apache.
# NCSA is permissive, and this reaches only the fuzz harness under fuzz/,
# which is outside the workspace and never shipped.
name = "libfuzzer-sys"
allow = ["NCSA"]
[[licenses.exceptions]]
name = "sipral-core"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-ua"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-rtp"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-nat"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-dtls"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-media"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-io-coreaudio"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-headless"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-ffi"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-io-wasapi"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-io-common"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-audio"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-io-pipewire"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-io-aaudio"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
# the interop harness under interop/, which drives the lab and is never shipped
name = "sipral-interop"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
# the generator under tools/, which prints the header and the bindings and is
# never shipped either
name = "sipral-abi-gen"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
# the other tool under tools/: it writes the fuzz seed corpus out of the
# library's own encoders, and is never shipped
name = "sipral-fuzz-seeds"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
# the third tool under tools/: it writes THIRD-PARTY-LICENSES.txt out of the
# dependency graph, and is never shipped
name = "sipral-license-gen"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
# the fourth tool under tools/: it writes the CycloneDX SBOM beside each
# packaged artefact, out of the same dependency graph, and is never shipped
name = "sipral-sbom-gen"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
# the pcapng export and redaction library under crates/, and the fifth tool
# under tools/ that wraps it into a CLI; neither ships yet (`docs/14-diagnostics.md`)
name = "sipral-diag"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-diag-export"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
# crates/sipral-aec-webrtc, outside the workspace and checked with its own
# `cargo deny`, not the one this file otherwise gates -- kept here anyway so
# the same allow-list covers webrtc-audio-processing's BSD-3-Clause too,
# rather than a second copy of it living beside that crate's Cargo.toml
name = "sipral-aec-webrtc"
allow = ["AGPL-3.0-only"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Both call themselves MIT and "pure Rust". Both are bcg729 transliterated from
# C: the file names match bcg729's one for one, down to its own misspelling of
# "adaptative", and the comments inside the functions are word for word the
# same. bcg729 is GPL-3, and neither names it. A licence scanner reads the
# manifest and sees MIT, so the ban has to be by name.
#
# They are the first hits for "g729" on crates.io, which is exactly why this
# entry exists: the next person to look does not have to repeat the diff.
[[bans.deny]]
name = "g729-sys"

[[bans.deny]]
name = "audio-codec"

[advisories]
yanked = "deny"
# The Marvin attack on `rsa`: a timing side channel in operations with an RSA
# private key, decryption and signing, which leaks that key. sipral-dtls uses
# the crate to check a peer's signatures with the peer's public key and holds
# no RSA private key at all — this end's own key is P-256 — so there is no
# secret for the channel to reach. Any use of an RSA private key added later
# takes this line out first.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "public-key verification only; no RSA private key is ever held" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
