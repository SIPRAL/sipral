# A single copyleft dependency would make the commercial licence arm
# undeliverable, so this fails the build rather than warning.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]

[[licenses.exceptions]]
# our own crates, dual-licensed; the AGPL arm is ours to grant
name = "sipral"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
# the fuzz harness, which is never distributed
name = "sipral-fuzz"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
# libFuzzer's bindings carry LLVM's old NCSA licence alongside MIT/Apache.
# NCSA is permissive, and this reaches only the fuzz harness under fuzz/,
# which is outside the workspace and never shipped.
name = "libfuzzer-sys"
allow = ["NCSA"]
[[licenses.exceptions]]
name = "sipral-core"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-ua"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-rtp"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-nat"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-media"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-io-coreaudio"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-headless"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-ffi"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
name = "sipral-io-wasapi"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
# the interop harness under interop/, which drives the lab and is never shipped
name = "sipral-interop"
allow = ["AGPL-3.0-only"]
[[licenses.exceptions]]
# the generator under tools/, which prints the header and the bindings and is
# never shipped either
name = "sipral-abi-gen"
allow = ["AGPL-3.0-only"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Both call themselves MIT and "pure Rust". Both are bcg729 transliterated from
# C: the file names match bcg729's one for one, down to its own misspelling of
# "adaptative", and the comments inside the functions are word for word the
# same. bcg729 is GPL-3, and neither names it. A licence scanner reads the
# manifest and sees MIT, so the ban has to be by name.
#
# They are the first hits for "g729" on crates.io, which is exactly why this
# entry exists: the next person to look does not have to repeat the diff.
[[bans.deny]]
name = "g729-sys"

[[bans.deny]]
name = "audio-codec"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
