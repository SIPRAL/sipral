name: sipral
description: >-
  Sipral - Session Initiation Protocol Rust Audio Layer. The Dart and Flutter
  binding over the C ABI, through dart:ffi.
version: 1.0.0
homepage: https://sipral.org
repository: https://github.com/SIPRAL/sipral/tree/main/bindings/dart
topics: [sip, voip, rtp, telephony, softphone]
# A guard, not a choice of registry: scripts/package/pub.sh stages a copy with
# this line removed, and that copy is what `dart pub publish` runs in.
publish_to: none

environment:
  sdk: ^3.7.0

dependencies:
  ffi: ^2.2.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0
