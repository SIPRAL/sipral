[workspace]
resolver = "3"
members = ["crates/*", "interop/harness", "tools/abi-gen", "tools/fuzz-seeds", "tools/license-gen"]
# fuzz/ needs a nightly compiler, so it keeps its own toolchain pin and its
# own lockfile rather than dragging one into the workspace.
# crates/sipral-aec-webrtc needs meson, ninja and a C++ toolchain to build
# its one dependency's bundled C++ library, which `cargo build --workspace`
# and `--all-features` do not ask this tree for anywhere else; it keeps its
# own lockfile too, and scripts/check.sh builds it as its own step. See the
# comment at the top of its Cargo.toml.
exclude = ["fuzz", "crates/sipral-aec-webrtc"]

[workspace.dependencies]
sipral-core = { path = "crates/sipral-core", version = "0.0.1" }

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only OR LicenseRef-Sipral-Commercial"
authors = ["Tiberiu Balasea"]
repository = "https://github.com/SIPRAL/sipral"
homepage = "https://sipral.org"
keywords = ["sip", "voip", "rtp", "telephony", "softphone"]
categories = ["network-programming", "multimedia::audio"]
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
# every interval in SIP is delta-seconds on the wire — `Expires: 3600`,
# `Retry-After: 600`, T1 in milliseconds — and rewriting 3060 as "51 minutes"
# hides the arithmetic the line exists to show
duration_suboptimal_units = "allow"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
# unwind, not abort: sipral-ffi catches panics at the C boundary
strip = true
