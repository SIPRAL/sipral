# RFC 4475 torture test corpus, extracted byte for byte from the archive in
# Appendix A of the RFC. One entry per message, in RFC order.
#
# outcome: parse    = must parse and round trip
#          reject   = must be rejected cleanly
#          semantic = well formed; expected behaviour is in the RFC section

[archive]
source = "https://www.rfc-editor.org/rfc/rfc4475.txt"
sha256_tar_gz = "4ce03214334379f350f0d1f7998ac03dbe1ce046676551adca2a5e8fb0f819dd"
messages = 49

[groups."3.1.1-valid"]
outcome = "parse"
description = "Parser tests: valid messages. Must parse and round trip."

[groups."3.1.2-invalid"]
outcome = "reject"
description = "Parser tests: invalid messages. Must be rejected without panic or unbounded work."

[groups."3.2-transaction"]
outcome = "semantic"
description = "Transaction layer semantics. Well formed; the expected behaviour is in the RFC section."

[groups."3.3-application"]
outcome = "semantic"
description = "Application layer semantics. Well formed; the expected behaviour is in the RFC section."

[groups."3.4-backward-compat"]
outcome = "semantic"
description = "Backward compatibility with RFC 2543 syntax."

