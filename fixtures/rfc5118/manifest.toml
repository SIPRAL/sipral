# RFC 5118 IPv6 torture test corpus. One entry per message, in RFC order.
#
# outcome: accept = well formed; must parse and pass validation
#          reject = must be refused, by the parser or by validation
#
# Every file is the message of that name from the archive in RFC 5118
# Appendix A, decoded and unpacked, not a byte changed. README.md says how
# the test puts each on the wire.

[source]
rfc = "https://www.rfc-editor.org/rfc/rfc5118.txt"
archive_sha256 = "5a4dbe78d80216b46b5c64b14d7dcefe2d563c61418cc597302b4bec13fa9067"
messages = 12

