# Outside the workspace on purpose: libFuzzer needs a nightly compiler, and the
# rest of the tree keeps its stable pin. See rust-toolchain.toml beside this.

[package]
name = "sipral-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only OR LicenseRef-Sipral-Commercial"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.sipral-core]
path = "../crates/sipral-core"

[dependencies.sipral-headless]
path = "../crates/sipral-headless"

[dependencies.sipral-ua]
path = "../crates/sipral-ua"

[dependencies.sipral-rtp]
path = "../crates/sipral-rtp"

[dependencies.sipral-nat]
path = "../crates/sipral-nat"

[dependencies.sipral-dtls]
path = "../crates/sipral-dtls"

[dependencies.sipral-media]
path = "../crates/sipral-media"

[dependencies.sipral-stir]
path = "../crates/sipral-stir"

# the facade, for `headless_media` alone: `HeadlessSession` is where the
# socket's frames meet a codec's, and it lives nowhere below this crate.
# Without libopus, DTLS or ICE, none of which that target reaches.
[dependencies.sipral]
path = "../crates/sipral"
default-features = false
features = ["headless"]

[workspace]

[profile.release]
debug = true

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

