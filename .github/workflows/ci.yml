name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml is the single source of truth for the toolchain
      - run: rustup toolchain install
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --release

  # the lab is real software on default settings, so it finds the class of
  # failure a test against ourselves never can. It is a job of its own because
  # it pulls three images and boots them, and nothing else should wait for that
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sipral-interop
      - name: bring the lab up
        working-directory: interop
        run: |
          mkdir -p pcap
          docker compose up -d
      # an active probe rather than a fixed sleep: FreeSWITCH is much the
      # slowest of the three to open its socket, and how slow depends on the
      # runner
      - name: wait for the servers to listen
        working-directory: interop
        run: |
          for service in kamailio freeswitch asterisk; do
            ready=""
            for _ in $(seq 1 60); do
              if docker compose exec -T "$service" sh -c \
                  'netstat -lun 2>/dev/null | grep -q ":5060"'; then
                ready=yes
                break
              fi
              sleep 2
            done
            if [ -z "$ready" ]; then
              echo "$service never opened 5060"
              docker compose logs --no-color "$service" | tail -50
              exit 1
            fi
            echo "$service is listening"
          done
      - name: start the capture
        working-directory: interop
        run: docker compose --profile capture up -d capture
      - name: register, call, hold, resume
        working-directory: interop
        run: |
          docker compose run --rm --no-deps \
            -v "$GITHUB_WORKSPACE/target/release/sipral-interop:/harness:ro" \
            --entrypoint /harness kamailio kamailio 5060 9000
      - name: what the servers said
        if: always()
        working-directory: interop
        run: docker compose logs --no-color
      - name: keep the capture
        if: always()
        working-directory: interop
        run: docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interop-capture
          path: interop/pcap/
          if-no-files-found: warn

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: headers, provenance, language
        run: ./scripts/check.sh --hygiene-only
      # the gitleaks binary is MIT; only the marketplace action wants a licence on org repos
      - name: gitleaks over the whole history
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --no-banner --redact --source .
