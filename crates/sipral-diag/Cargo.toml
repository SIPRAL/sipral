[package]
name = "sipral-diag"
description = "Turns a D2 replay recording into pcapng, and redacts personal data out of a SIP message before it leaves the organisation."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# the arm crates.io reads; why the dual expression is not here is in
# crates/sipral/Cargo.toml
license = "AGPL-3.0-only"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[dependencies]
sipral-core = { path = "../sipral-core", version = "=1.2.3" }
# same pin and feature set sipral-dtls already carries these at; nothing new
# enters the dependency graph, only a second consumer of what is already in it
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
# the pseudonym key a `Mode::Hash` holds, wiped when it goes: the write that
# survives the optimiser needs `unsafe`, which this crate denies
zeroize = "=1.9.1"

[dev-dependencies]
# the layer a registration is decided in, for the test that replays the
# recording in the tree into it and exports both directions of the session
sipral-ua = { path = "../sipral-ua", version = "=1.2.3" }

[lints]
workspace = true
