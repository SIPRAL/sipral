[package]
name = "sipral"
description = "Sipral - Session Initiation Protocol Rust Audio Layer. A SIP + RTP client stack in one crate: signalling from sipral-ua joined to a media pipeline, with Swift, .NET and Kotlin bindings. Pre-release; the ABI is not frozen."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# not `license.workspace = true`, deliberately. The workspace expression names
# the commercial arm with a `LicenseRef-`, and neither crates.io nor nuget.org
# resolves one: crates.io validates the field against the SPDX licence list,
# and NuGet accepts only expressions approved by the OSI or the FSF. This is
# the crate that publishes, so it declares the arm that a registry can read.
# The dual expression is where it belongs and where it is read: the SPDX header
# of every file, and LICENSING.md.
license = "AGPL-3.0-only"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# the one crate that ships before the ABI freezes: a name reservation
publish = true

[features]
# `sipral-media`'s own feature, carried up so that an application depends on
# this crate and nothing else to decide it. On by default, off for the build
# that must not link libopus — the reason is in `crates/sipral-media/Cargo.toml`
# and in `docs/05-media.md`. With it off, `Codec::ALL` is G.722 and the two
# G.711 laws, and a peer that offers nothing else is a call with no audio in
# the ordinary way, not a special kind of failure.
#
# `dtls` is the other one, and it is off the same pattern for a different
# reason. libopus is a licensing question; this is a size one. DTLS-SRTP
# brings `sipral-dtls` and the four RustCrypto crates under it — an elliptic
# curve, AES-GCM, SHA-256 and HMAC — into a build that may never place a call
# that uses them, because an SDES stream over a TLS-protected SIP transport is
# what most carriers ask for and all a deployment behind one carrier will ever
# see. With it off there is no handshake, no certificate and no fingerprint in
# any offer this stack writes, `Capabilities::srtp_keying` says so before a
# call is placed, and a peer that offers `UDP/TLS/RTP/SAVP` has its stream
# refused rather than answered with keys that cannot arrive.
#
# `ice` is the third, and it is off the same pattern again. It brings nothing
# new into the build — `sipral-nat` is already here for `dtls` — so the cost
# it is weighed against is not size but the wire: 143 bytes per candidate in a
# body `docs/06-nat.md` argues has to fit a datagram, and a round of checks
# before the first audio packet. On by default all the same, because what it
# defaults *to* is [`IcePolicy::Off`]: the feature decides whether an
# application can ask for ICE at all, and the policy decides whether this call
# does. A build that must not carry the agent at all turns it off, and then
# `Capabilities` says so before a call is placed.
default = ["opus", "dtls", "ice"]
opus = ["sipral-media/opus"]
dtls = ["dep:sipral-dtls", "dep:sipral-nat"]
ice = ["dep:sipral-nat"]
# `tls.rs` alone: a feature cannot turn on a dev-dependency, only a normal
# one, so `rustls` sits here, optional, reached by nothing this crate ships.
# It is how that one example supplies the TLS this crate never links itself
# (`docs/01-architecture.md`, "who owns the sockets, the resolver and TLS") —
# proof of the seam, not a dependency an application inherits.
example-tls = ["dep:rustls", "dep:rustls-native-certs", "dep:rustls-pki-types"]
# `sipral-headless`'s own sans-I/O socket protocol, paired here with a live
# `MediaSession` — `crates/sipral/src/headless.rs`, `docs/07-headless.md`'s
# own "Real media" section. Off by default on the `dtls`/`ice` pattern: a
# softphone build that never answers a call from an agent framework links
# none of it, and `sipral-headless` itself still names no Sipral crate —
# only this feature's edge exists, and only in this manifest.
headless = ["dep:sipral-headless"]

# with `opus` off there is no `Codec::Opus` and the enumeration is three long,
# so docs.rs is told to build the whole surface rather than whichever half a
# default would have given it
[package.metadata.docs.rs]
all-features = true

[dependencies]
sipral-core.workspace = true
sipral-ua = { path = "../sipral-ua", version = "0.0.1" }
sipral-rtp = { path = "../sipral-rtp", version = "0.0.1" }
# `default-features = false` is what makes this crate's own feature mean
# anything: without it, `--no-default-features` on this crate would still link
# libopus through `sipral-media` and prove nothing.
sipral-media = { path = "../sipral-media", version = "0.0.1", default-features = false }
# DTLS-SRTP, behind the `dtls` feature. Two crates rather than one: the
# handshake that produces the keys, and the one octet of RFC 7983 that tells a
# DTLS record from the RTP beside it on the same socket. The second is written
# where ICE will need it too, so it is read from there rather than copied.
sipral-dtls = { path = "../sipral-dtls", version = "0.0.1", optional = true }
sipral-nat = { path = "../sipral-nat", version = "0.0.1", optional = true }
# behind `headless` alone: the one edge `docs/01-architecture.md`'s diagram
# marks as an exception, and only in this manifest — see the feature's own
# comment above.
sipral-headless = { path = "../sipral-headless", version = "0.0.1", optional = true }
# already a dependency of `sipral-rtp` and `sipral-dtls`, pinned to the same
# version here: wiping the SRTP master key and salt draw_key hands out (8.2.9)
# needs a write the optimiser is not allowed to remove, and that needs
# `unsafe`, which this crate denies.
zeroize = "=1.9.0"
# `example-tls`, used by `examples/tls.rs` alone: `default-features = false`
# plus `ring` drops the default `aws_lc_rs` provider, which needs `cmake` to
# build; `ring` needs only a C compiler, already required elsewhere in this
# workspace. Both providers' licences are in `deny.toml`'s allow list, so this
# is a build-footprint choice, not a licensing one.
rustls = { version = "0.23.45", default-features = false, features = [
    "ring",
    "std",
    "tls12",
], optional = true }
# the platform trust store, so the example checks a real certificate chain the
# way an application would rather than trusting anything that arrives.
rustls-native-certs = { version = "0.8.4", optional = true }
rustls-pki-types = { version = "1.15.1", optional = true }

# `tls.rs`'s own test, which proves the TLS transport against a local server
# rather than one on the Internet: a throwaway self-signed certificate, minted
# fresh per test run rather than committed. Unconditional, not behind
# `example-tls`, for the reason `rustls` above is not a dev-dependency: a
# feature cannot reach one. `cargo test -p sipral` without that feature builds
# it and runs nothing that uses it, since the test itself is on `tls.rs`,
# which `required-features` below keeps out of that build entirely.
#
# Its default features pull in `ring` on their own — signing a certificate
# needs a crypto backend, and `ring` is the only one this workspace allows
# (`THIRD-PARTY-NOTICES.md`) — so `ring` reaches this crate's dev-profile
# unconditionally, the same way `opusic-sys` reaches its normal one under the
# default `opus` feature: a native build needs nothing extra, and a target
# cross-compiled without a matching C toolchain fails regardless of
# `example-tls` or `--no-default-features`.
[dev-dependencies]
rcgen = "0.14.10"
# the examples' seeds, from the operating system's entropy. The library draws
# no randomness of its own and takes its seeds from the application, which is
# what an example has to show being done; a constant there would give every
# run the same tags and Call-IDs, and an SDES call the same key. 0.2 rather
# than 0.4 because `ring` above already brings 0.2 in, and a second copy for
# the same two system calls buys nothing.
getrandom = "0.2.17"

# the examples' own audio device, macOS and iOS only. `sipral-io-coreaudio`
# does not depend on this crate, so pulling it in here for `examples/` opens
# no cycle; on every other target the examples that need it write a WAV file
# instead (see `crates/sipral/examples/call.rs`).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
sipral-io-coreaudio = { path = "../sipral-io-coreaudio", version = "0.0.1" }

# without this, `cargo build --examples` fails on every target that has not
# opted into `example-tls`, and `cargo test --workspace` is one of them
[[example]]
name = "tls"
required-features = ["example-tls"]

# `tests/headless_bridge.rs` names `sipral-headless` directly, so it only
# builds where that dependency does — the same shape as `tls` above, and for
# the same reason: `cargo test --workspace` must not fail on a build that
# left `headless` out.
[[test]]
name = "headless_bridge"
required-features = ["headless"]

# `examples/headless-socket-agent.rs` names `sipral-headless` and this
# crate's own `HeadlessSession`, both behind `headless`; without this,
# `cargo build --examples` fails on every build that left the feature out,
# `cargo test --workspace` among them.
[[example]]
name = "headless-socket-agent"
required-features = ["headless"]

[lints]
workspace = true
