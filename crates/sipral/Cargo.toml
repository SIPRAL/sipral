[package]
name = "sipral"
description = "Sipral - Session Initiation Protocol Rust Audio Layer. A SIP + RTP client stack in one crate: signalling from sipral-ua joined to a media pipeline, with Swift, .NET and Kotlin bindings. Pre-release; the ABI is not frozen."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# not `license.workspace = true`, deliberately. The workspace expression names
# the commercial arm with a `LicenseRef-`, and neither crates.io nor nuget.org
# resolves one: crates.io validates the field against the SPDX licence list,
# and NuGet accepts only expressions approved by the OSI or the FSF. This is
# the crate that publishes, so it declares the arm that a registry can read.
# The dual expression is where it belongs and where it is read: the SPDX header
# of every file, and LICENSING.md.
license = "AGPL-3.0-only"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# the one crate that ships before the ABI freezes: a name reservation
publish = true

[features]
# `sipral-media`'s own feature, carried up so that an application depends on
# this crate and nothing else to decide it. On by default, off for the build
# that must not link libopus — the reason is in `crates/sipral-media/Cargo.toml`
# and in `docs/05-media.md`. With it off, `Codec::ALL` is G.722 and the two
# G.711 laws, and a peer that offers nothing else is a call with no audio in
# the ordinary way, not a special kind of failure.
#
# `dtls` is the other one, and it is off the same pattern for a different
# reason. libopus is a licensing question; this is a size one. DTLS-SRTP
# brings `sipral-dtls` and the four RustCrypto crates under it — an elliptic
# curve, AES-GCM, SHA-256 and HMAC — into a build that may never place a call
# that uses them, because an SDES stream over a TLS-protected SIP transport is
# what most carriers ask for and all a deployment behind one carrier will ever
# see. With it off there is no handshake, no certificate and no fingerprint in
# any offer this stack writes, `Capabilities::srtp_keying` says so before a
# call is placed, and a peer that offers `UDP/TLS/RTP/SAVP` has its stream
# refused rather than answered with keys that cannot arrive.
#
# `ice` is the third, and it is off the same pattern again. It brings nothing
# new into the build — `sipral-nat` is already here for `dtls` — so the cost
# it is weighed against is not size but the wire: 143 bytes per candidate in a
# body `docs/06-nat.md` argues has to fit a datagram, and a round of checks
# before the first audio packet. On by default all the same, because what it
# defaults *to* is [`IcePolicy::Off`]: the feature decides whether an
# application can ask for ICE at all, and the policy decides whether this call
# does. A build that must not carry the agent at all turns it off, and then
# `Capabilities` says so before a call is placed.
default = ["opus", "dtls", "ice"]
opus = ["sipral-media/opus"]
dtls = ["dep:sipral-dtls", "dep:sipral-nat"]
ice = ["dep:sipral-nat"]

# with `opus` off there is no `Codec::Opus` and the enumeration is three long,
# so docs.rs is told to build the whole surface rather than whichever half a
# default would have given it
[package.metadata.docs.rs]
all-features = true

[dependencies]
sipral-core.workspace = true
sipral-ua = { path = "../sipral-ua", version = "0.0.1" }
sipral-rtp = { path = "../sipral-rtp", version = "0.0.1" }
# `default-features = false` is what makes this crate's own feature mean
# anything: without it, `--no-default-features` on this crate would still link
# libopus through `sipral-media` and prove nothing.
sipral-media = { path = "../sipral-media", version = "0.0.1", default-features = false }
# DTLS-SRTP, behind the `dtls` feature. Two crates rather than one: the
# handshake that produces the keys, and the one octet of RFC 7983 that tells a
# DTLS record from the RTP beside it on the same socket. The second is written
# where ICE will need it too, so it is read from there rather than copied.
sipral-dtls = { path = "../sipral-dtls", version = "0.0.1", optional = true }
sipral-nat = { path = "../sipral-nat", version = "0.0.1", optional = true }
# already a dependency of `sipral-rtp` and `sipral-dtls`, pinned to the same
# version here: wiping the SRTP master key and salt draw_key hands out (8.2.9)
# needs a write the optimiser is not allowed to remove, and that needs
# `unsafe`, which this crate denies.
zeroize = "=1.9.0"

[lints]
workspace = true
