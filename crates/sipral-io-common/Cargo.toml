[package]
name = "sipral-io-common"
description = "The parts of a Sipral audio device backend that are not about any device."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# the arm crates.io reads; why the dual expression is not here is in
# crates/sipral/Cargo.toml
license = "AGPL-3.0-only"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[dependencies]

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "deny"
