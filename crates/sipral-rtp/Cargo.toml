[package]
name = "sipral-rtp"
description = "RTP and RTCP, adaptive jitter buffer, packet loss concealment, DTMF and SRTP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
# The one primitive that is not written in-tree. A table-driven AES leaks its
# key through the cache, and the headless mode is meant to run on machines
# shared with strangers; this crate reaches for AES-NI and the ARMv8 crypto
# instructions and falls back to a bitsliced implementation, so it is
# constant-time on every target we ship. SHA-1, HMAC, the counter mode, the
# key derivation and everything else in `srtp` are ours.
aes = { version = "=0.9.3", features = ["zeroize"] }
# RFC 7714's AEAD_AES_128_GCM and AEAD_AES_256_GCM: the same version
# `sipral-dtls` already vets for its own record protection, reused rather
# than reaching for a second AES-GCM implementation
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "zeroize"] }
# wiping master and session keys when they go out of scope needs a write the
# optimiser is not allowed to remove, and that needs `unsafe`, which this
# crate denies
zeroize = "=1.9.0"

[lints]
workspace = true
