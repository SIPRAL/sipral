[package]
name = "sipral-stir"
description = "STIR/SHAKEN caller authentication, sans-I/O: PASSporT, the Identity header, TNAuthList certificates, signing and verification."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# the arm crates.io reads; why the dual expression is not here is in
# crates/sipral/Cargo.toml
license = "AGPL-3.0-only"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = true

[features]
# A throwaway PKI for other crates' tests: a root, an intermediate and a
# signing certificate whose TNAuthList covers the numbers asked for, built
# in memory from fixed keys. Never on in anything that ships; `sipral-ua` and
# `sipral-ffi` turn it on for their test builds alone.
testing = []

[dependencies]
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
x509-cert = { version = "=0.3.0", default-features = false }
# the scalar a signing key is read out of, wiped when it has been read;
# already beneath `p256`, at the version `sipral-rtp` pins
zeroize = "=1.9.1"

[lints]
workspace = true
