[package]
name = "sipral-ua"
description = "Registration, calls, hold, transfer and event subscriptions, built on sipral-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[features]
# The loop over `std::net` from `docs/04-ua.md`. Off by default: it opens
# sockets, which nothing else in this workspace does, and it resolves names
# with what the standard library gives rather than with RFC 3263's SRV.
reference-loop = []
# STIR/SHAKEN in calls (`crate::stir`): the INVITEs an account places signed,
# the ones it receives verified. Off here, on in the facade's default: it
# brings `sipral-stir`, and with it P-256 and an X.509 reader, into a build
# that may never sign or verify anything.
stir = ["dep:sipral-stir"]

[dependencies]
sipral-core.workspace = true
sipral-stir = { path = "../sipral-stir", version = "1.1.0", optional = true }
# SHA-1 for the one thing RFC 6455 §4.2.2 uses it for, the
# Sec-WebSocket-Accept a server owes for the handshake's key
# (`crate::websocket`); the same RustCrypto family and pin line as the
# `sha2` `sipral-dtls` already carries, so the digest crates under it are
# the ones already in the build.
sha1 = { version = "=0.11.0", default-features = false }

[dev-dependencies]
sipral-stir = { path = "../sipral-stir", version = "1.1.0", features = ["testing"] }

[lints]
workspace = true
