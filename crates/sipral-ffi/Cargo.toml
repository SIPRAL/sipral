[package]
name = "sipral-ffi"
description = "Stable C ABI over the Sipral stack, and the base for the Swift, .NET, Kotlin and Python bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
# rlib because the tests, `tools/abi-gen` and the interop harness link this
# crate as a Rust library; cdylib and staticlib because a C ABI nobody can
# link is a header and not a library, and a crate that says nothing here
# produces neither. All three come out of one `cargo build --release`.
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# The facade's Opus feature, carried up once more so that an application
# linking the C ABI and nothing else still decides it here. On by default.
# Nothing in this crate branches on it: `SIPRAL_FEATURE_OPUS`, the codec list
# and every name the ABI gives a codec are read from the catalogue `sipral`
# hands down, because a feature belongs to the crate that declares it and
# this one can be off over a facade that did link libopus. `SIPRAL_CODEC_OPUS`
# is 4 in every build and always will be, because a number that has left this
# header is spent for good.
#
# The facade's DTLS-SRTP feature, carried up the same way and on by default.
# Unlike `opus`, this crate does branch on it: the arms that read a handshake
# out of a `MediaEvent` and put a record on the wire name types that exist
# only where the facade compiled them. What does not branch on it is the
# header — `SIPRAL_SRTP_DTLS`, `SIPRAL_SRTP_DTLS_REQUIRED`,
# `SIPRAL_EVENT_KIND_MEDIA_SECURED` and `sipral_media_poll_transmit` are in
# every build of it, because a name that has left this header is spent for
# good. A build without the feature answers `SIPRAL_STATUS_NOT_SUPPORTED` to
# the policies and "nothing due" to the poll, and `SIPRAL_FEATURE_DTLS_SRTP`
# says so before an application asks.
#
# `ice` is the third, carried up the same way and on by default, and it
# branches here for the same reason `dtls` does: the arms that name an ICE
# policy and the event that says which path was chosen name types that exist
# only where the facade compiled them. The header does not branch on it
# either — `SIPRAL_ICE_OFFERED`, `SIPRAL_ICE_REQUIRED` and
# `SIPRAL_EVENT_KIND_MEDIA_PATH_CHOSEN` are in every build of it. A build
# without the feature answers `SIPRAL_STATUS_NOT_SUPPORTED` to the policies
# and never emits the event, and `SIPRAL_FEATURE_ICE` says so before an
# application asks. It carries the facade's `ice-lite` with it, so that
# `SIPRAL_ICE_LITE` names a policy wherever `SIPRAL_ICE_OFFERED` does: the
# lite role is chosen per stack or per call like the other two, and nothing
# of `sipral-headless` comes with it.
#
# `stun` is the fourth, and branches here for the same reason: the stack's
# mappings are the facade's `Mappings`. `SIPRAL_NAT_STUN`, the four
# `sipral_stack_*stun*`/`nat` entry points and `SIPRAL_EVENT_KIND_NAT_MAPPING`
# are in every build of the header; a build without the feature refuses
# `SIPRAL_NAT_STUN` with `SIPRAL_STATUS_NOT_SUPPORTED`, and
# `SIPRAL_FEATURE_STUN` says so first.
#
# `stir` is the fifth, carried up the same way and on by default: the
# facade's STIR/SHAKEN, whose signer, trust anchors and verdicts the entry
# points here build and read. The header does not branch on it either —
# `SIPRAL_EVENT_KIND_CALLER_VERIFICATION`, `sipral_stack_stir` and the
# account's `stir_*` members are in every build of it; a build without the
# feature answers `SIPRAL_STATUS_NOT_SUPPORTED` to a key or to trust
# anchors, and `SIPRAL_FEATURE_STIR` says so first.
default = ["opus", "dtls", "ice", "stun", "stir"]
opus = ["sipral/opus"]
stir = ["sipral/stir", "sipral-ua/stir"]
dtls = ["sipral/dtls"]
ice = ["sipral/ice", "sipral/ice-lite", "sipral-audio/ice"]
stun = ["sipral/stun"]

[dependencies]
# the facade, which is what carries media across this boundary. The two below
# it stay because this crate drives the endpoint directly in places the facade
# has no opinion about -- transport binding, timers, an in-dialog INFO -- and
# they are the same crates the facade re-exports, so no type is duplicated.
# `redaction` always: the log and the state snapshot redact what they write
# (`crate::log`), and a build that could not would have to leave both out
sipral = { path = "../sipral", version = "1.1.0", default-features = false, features = ["redaction"] }
sipral-core.workspace = true
sipral-ua = { path = "../sipral-ua", version = "1.1.0" }
# the built-in audio engine behind `sipral_stack_config_t::audio`: the
# platform's devices opened and pumped by the library, for the stack that
# asks. Its `ice` follows this crate's, so that what the pump captures says
# how it leaves a media socket the way `sipral_media_capture` does.
sipral-audio = { path = "../sipral-audio", version = "1.1.0" }
# the two seeds a stack is created with, wiped once the engine and the agent
# hold their own copies; the version `sipral` names, so nothing new enters
# the build
zeroize = "=1.9.0"

[dev-dependencies]
# the engine's fake platform, for this crate's own tests of device mode:
# a feature turned on from here reaches only the test build, so no release
# build of the library carries a fake device
sipral-audio = { path = "../sipral-audio", version = "1.1.0", features = ["fake"] }
# the far end's connectivity checks, signed with the password this end's offer
# gave out, for the tests of what reaches a call's socket before its media
# handle does. The same STUN code the facade already links, so nothing new
# enters the build.
sipral-nat = { path = "../sipral-nat", version = "1.1.0" }
# the throwaway STIR PKI the tests of a signed call through this ABI verify
# against, built in memory from fixed keys
sipral-stir = { path = "../sipral-stir", version = "1.1.0", features = ["testing"] }
# the far end's audio for the tests of what a call hears in it -- a digit's
# two tones, a greeting -- written and companded with the same code the
# facade already links, so nothing new enters the build either
sipral-media = { path = "../sipral-media", version = "1.1.0", default-features = false }

[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
assert_is_empty = "allow"
chunks_exact_to_as_chunks = "allow"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "deny"
