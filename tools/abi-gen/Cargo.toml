[package]
name = "sipral-abi-gen"
description = "Prints the C header and the Swift, Kotlin, .NET and Python bindings from the ABI sipral-ffi declares."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "abi-gen"
path = "src/main.rs"

[dependencies]
sipral-ffi = { path = "../../crates/sipral-ffi", version = "0.0.1" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "deny"
