[package]
name = "sipral-fuzz-seeds"
description = "Writes the seed corpus the fuzz targets start from, out of this repository's own writers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "fuzz-seeds"
path = "src/main.rs"

[dependencies]
# the facade without libopus, DTLS or ICE: `HeadlessSession`, for the
# `headless_media` seeds, is the one thing read from it
sipral = { path = "../../crates/sipral", version = "0.0.1", default-features = false, features = ["headless"] }
sipral-core = { path = "../../crates/sipral-core", version = "0.0.1" }
sipral-dtls = { path = "../../crates/sipral-dtls", version = "0.0.1" }
sipral-headless = { path = "../../crates/sipral-headless", version = "0.0.1" }
sipral-media = { path = "../../crates/sipral-media", version = "0.0.1" }
sipral-nat = { path = "../../crates/sipral-nat", version = "0.0.1" }
sipral-rtp = { path = "../../crates/sipral-rtp", version = "0.0.1" }
sipral-stir = { path = "../../crates/sipral-stir", version = "0.0.1" }
sipral-ua = { path = "../../crates/sipral-ua", version = "0.0.1" }
# the stir_identity seeds carry a certificate chain, and its signatures are
# P-256 like the PASSporT's: the same crate, at the same version, that
# sipral-stir verifies them with
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }

[lints]
workspace = true
