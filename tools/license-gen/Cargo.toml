[package]
name = "sipral-license-gen"
description = "Regenerates THIRD-PARTY-LICENSES.txt from the normal dependency graph of the shipped crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "license-gen"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "deny"
