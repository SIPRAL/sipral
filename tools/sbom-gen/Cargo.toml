[package]
name = "sipral-sbom-gen"
description = "Writes a CycloneDX SBOM for one packaged artefact, from the real dependency graph of what it ships."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "sbom-gen"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "deny"
